<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casos Pràctics – Sistema Musculoesquelètic (Fisiologia de la Dansa)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f0f2f5;color:#333;line-height:1.6}
.top-bar{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:30px 20px;text-align:center;position:relative}
.top-bar h1{font-size:1.8em;margin-bottom:5px}
.top-bar p{opacity:.85;font-size:.95em}
.lang-selector{position:absolute;top:15px;right:20px;display:flex;gap:8px;z-index:10}
.lang-btn{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:.85em;transition:all .3s}
.lang-btn:hover{background:rgba(255,255,255,.3)}
.lang-btn.active{background:#fff;color:#1a1a2e;border-color:#fff}
.wrap{max-width:960px;margin:0 auto;padding:20px}
.personal{background:#fff;border-radius:14px;padding:28px 32px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.personal h2{color:#1a1a2e;margin-bottom:16px;font-size:1.3em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid label{font-weight:600;font-size:.9em;color:#555;display:block;margin-bottom:4px}
.form-grid input{width:100%;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:1em;transition:.3s}
.form-grid input:focus{border-color:#667eea;outline:none}
.time-row{display:flex;gap:14px;margin-top:14px}
.time-row div{flex:1}
.btn-start{margin-top:16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:1.05em;cursor:pointer;transition:.3s}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.4)}
.block{background:#fff;border-radius:14px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;display:none}
.block.active{display:block}
.block-header{padding:22px 28px;color:#fff;font-size:1.2em;font-weight:700}
.block-header small{display:block;font-weight:400;font-size:.75em;opacity:.9;margin-top:4px}
.bh1{background:linear-gradient(135deg,#667eea,#764ba2)}
.bh2{background:linear-gradient(135deg,#11998e,#38ef7d)}
.bh3{background:linear-gradient(135deg,#ee5a6f,#ff6b6b)}
.bh4{background:linear-gradient(135deg,#f7971e,#ffd200)}
.bh5{background:linear-gradient(135deg,#6a11cb,#2575fc)}
.bh6{background:linear-gradient(135deg,#fc4a1a,#f7b733)}
.bh7{background:linear-gradient(135deg,#0f2027,#2c5364)}
.block-body{padding:20px 28px 28px}
.caso{background:#fafbfc;border:1px solid #e8ecf1;border-radius:10px;padding:20px;margin-bottom:18px;position:relative}
.caso-tag{display:inline-block;font-size:.7em;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff;margin-bottom:10px}
.caso h4{font-size:1.05em;color:#1a1a2e;margin-bottom:10px}
.opts label{display:block;padding:10px 14px;margin:5px 0;background:#fff;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;transition:.25s;font-size:.95em}
.opts label:hover{border-color:#667eea;background:#f5f3ff}
.opts input[type=radio]{margin-right:8px;accent-color:#667eea}
.opts label.sel{border-color:#667eea;background:#ede9fe}
.opts label.correct{border-color:#2e7d32;background:#e8f5e9}
.opts label.wrong{border-color:#c62828;background:#ffebee}
.explicacion-user{width:100%;margin-top:10px;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:.9em;resize:vertical;min-height:50px}
.explicacion-user:focus{border-color:#667eea;outline:none}
.btn-val{margin-top:10px;background:#667eea;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:.9em;transition:.3s}
.btn-val:hover{background:#5a6fd6}
.btn-val:disabled{background:#bbb;cursor:default}
.feedback{margin-top:10px;padding:12px 16px;border-radius:8px;font-size:.92em;display:none;line-height:1.6}
.feedback.ok{display:block;background:#e8f5e9;border-left:4px solid #2e7d32;color:#1b5e20}
.feedback.bad{display:block;background:#ffebee;border-left:4px solid #c62828;color:#b71c1c}
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0}
.btn-nav{padding:10px 24px;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:.3s;color:#fff}
.btn-prev{background:#78909c}
.btn-next{background:#667eea}
.btn-nav:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-nav:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.progress{font-size:.9em;color:#666;font-weight:600}
.send-section{background:#fff;border-radius:14px;padding:28px 32px;margin-bottom:40px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center;display:none}
.send-section h2{color:#1a1a2e;margin-bottom:10px}
.score-display{font-size:2em;font-weight:700;color:#667eea;margin:16px 0}
.btn-send{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;padding:14px 36px;border-radius:8px;font-size:1.1em;cursor:pointer;transition:.3s;margin-top:10px}
.btn-send:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,125,50,.4)}
.btn-print{background:linear-gradient(135deg,#1565c0,#1976d2);color:#fff;border:none;padding:14px 36px;border-radius:8px;font-size:1.1em;cursor:pointer;transition:.3s;margin-top:10px;margin-left:10px}
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .time-row{flex-direction:column}
  .top-bar h1{font-size:1.3em}
  .lang-selector{position:static;justify-content:center;margin-top:15px}
}
@media print{
  .btn-val,.btn-nav,.btn-start,.btn-send,.btn-print,.nav-bar,.lang-selector{display:none!important}
  .block{display:block!important;break-inside:avoid}
  .send-section{display:block!important}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="lang-selector">
    <button class="lang-btn active" onclick="setLang('ca')" id="btn-ca">CAT</button>
    <button class="lang-btn" onclick="setLang('es')" id="btn-es">ESP</button>
    <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENG</button>
  </div>
  <h1 id="t-top-title">🩰 Casos Pràctics – Sistema Musculoesquelètic</h1>
  <p id="t-top-sub">Fisiologia aplicada a la Dansa · Curs 2026-2027 · 70 casos en 7 blocs temàtics</p>
</div>

<div class="wrap">

<!-- PERSONALITZACIÓ -->
<div class="personal" id="personalForm">
  <h2 id="t-form-title">📝 Dades de l'alumnat</h2>
  <div class="form-grid">
    <div><label id="t-lbl-name">Nom complet</label><input type="text" id="stuName" placeholder="Ex: Maria López García"></div>
    <div><label id="t-lbl-email">Email</label><input type="email" id="stuEmail" placeholder="Ex: maria@escola.com"></div>
    <div><label id="t-lbl-prof">Email de la professora</label><input type="email" id="profEmail" placeholder="Ex: celia.painous@escola.com"></div>
    <div><label id="t-lbl-date">Data</label><input type="date" id="stuDate"></div>
  </div>
  <div class="time-row">
    <div><label id="t-lbl-start">Hora d'inici</label><input type="time" id="startTime"></div>
    <div><label id="t-lbl-end">Hora de finalització</label><input type="time" id="endTime" disabled></div>
  </div>
  <button class="btn-start" onclick="startTest()" id="t-btn-start">🚀 Començar test</button>
</div>

<!-- CONTENEDOR DE BLOQUES -->
<div id="blocksContainer"></div>

<!-- NAVEGACIÓ -->
<div class="nav-bar" id="navBar" style="display:none">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="navBlock(-1)">⬅ Anterior</button>
  <span class="progress" id="progressText"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="navBlock(1)">Següent ➡</button>
</div>

<!-- ENVIAMENT -->
<div class="send-section" id="sendSection">
  <h2 id="t-send-title">📊 Resultat final</h2>
  <div class="score-display" id="scoreDisplay"></div>
  <p id="scoreDetail"></p>
  <button class="btn-send" onclick="sendEmail()" id="t-btn-send">📧 Enviar a la professora per email</button>
  <button class="btn-print" onclick="window.print()" id="t-btn-print">🖨️ Imprimir / Guardar PDF</button>
</div>

</div>

<script>
// ===================== TRADUCCIONS =====================
const translations = {
  ca: {
    topTitle: "🩰 Casos Pràctics – Sistema Musculoesquelètic",
    topSub: "Fisiologia aplicada a la Dansa · Curs 2026-2027 · 70 casos en 7 blocs temàtics",
    formTitle: "📝 Dades de l'alumnat",
    lblName: "Nom complet", lblEmail: "Email", lblProf: "Email de la professora", lblDate: "Data",
    lblStart: "Hora d'inici", lblEnd: "Hora de finalització",
    btnStart: "🚀 Començar test",
    alertFill: "Si us plau, omple almenys el nom i l'email.",
    navPrev: "⬅ Anterior", navNext: "Següent ➡",
    progressText: (a,b) => `Bloc ${a} de ${b}`,
    sendTitle: "📊 Resultat final",
    btnSend: "📧 Enviar a la professora per email",
    btnPrint: "🖨️ Imprimir / Guardar PDF",
    casoLabel: "Cas",
    placeholderExp: "✏️ Explica breument per què has triat aquesta resposta...",
    btnValidate: "✅ Validar resposta",
    btnValidated: "✔ Validat",
    feedbackCorrect: "✅ <strong>Correcte!</strong><br>",
    feedbackWrong: (letter) => `❌ <strong>No és correcte.</strong> La resposta correcta és la <strong>${letter}</strong>.<br>`,
    emailSubject: (name, ok, total) => `Casos Pràctics – ${name} – ${ok}/${total}`,
    emailHeader: "CASOS PRÀCTICS – SISTEMA MUSCULOESQUELÈTIC",
    emailCourse: "Fisiologia de la Dansa · Curs 2026-2027",
    emailStudent: "Alumne/a", emailEmail: "Email", emailDate: "Data",
    emailStart: "Hora inici", emailEnd: "Hora final",
    emailResult: "RESULTAT",
    emailCase: "Cas", emailAnswer: "Resposta", emailCorrect: "Correcta",
    emailStudentExp: "Explicació de l'alumne",
    blockNames: [
      {name:"Homeòstasi i Regulació", ref:"Presentació I · Diapositives 2-7"},
      {name:"Estructura Muscular i Sarcòmer", ref:"Presentació I · Diapositives 8-11"},
      {name:"Contracció Muscular i Unitat Motora", ref:"Presentació I · Diapositives 12-16"},
      {name:"Components del Sistema i Biomecànica", ref:"Presentació II · Seccions 1-5"},
      {name:"Sistema Ossi", ref:"Presentació II · Seccions 6-11"},
      {name:"Articulacions i Cartílag", ref:"Presentació II · Seccions 12-14"},
      {name:"Plans de Moviment i Propiocepció", ref:"Presentació II · Seccions 15-16"}
    ],
    data: [
      // BLOQUE 1
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositives 2-7",
       q:"Durant un assaig de <em>grand allegro</em> de 20 minuts, la Lucía nota que la seva pell està envermellida i xopa de suor. Quina variable homeostàtica està intentant regular el seu cos principalment?",
       opts:["a) La glucosa sanguínia","b) La temperatura corporal","c) La pressió arterial","d) El pH del líquid intracel·lular"], correct:1,
       expl:"La sudoració i la vasodilatació cutània (pell envermellida) són mecanismes de termoregulació. El cos dissipa la calor generada per la contracció muscular per mantenir la temperatura dins del rang de 36-37,5 °C (Diapositiva 4: Homeòstasi)."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 3",
       q:"El cos d'un ballarí adult pesa 65 kg. Aproximadament, quants litres d'aigua conté el seu cos i on es troba la major part?",
       opts:["a) Uns 20 L, la majoria al líquid extracel·lular","b) Uns 39 L, la majoria al líquid intracel·lular (60-65%)","c) Uns 50 L, repartits a parts iguals","d) Uns 10 L, la majoria a la sang"], correct:1,
       expl:"L'aigua corporal total és aproximadament el 60% del pes (65 × 0,6 ≈ 39 L). D'aquesta aigua, el 60-65% està dins de les cèl·lules (LIC) i el 35-40% fora (LEC) (Diapositiva 3)."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 4",
       q:"Abans d'una audició important, a en Marc li mesuren la glucosa a la sang i obtenen 105 mg/dL. Aquest valor és compatible amb l'homeòstasi normal?",
       opts:["a) No, està massa alt; el normal és menys de 60 mg/dL","b) No, està massa baix; el normal és més de 150 mg/dL","c) Sí, està dins del rang normal de 75-110 mg/dL","d) No es pot saber sense mesurar el pH"], correct:2,
       expl:"El rang normal de glucosa a la sang és de 75-110 mg/dL (Diapositiva 4). Un valor de 105 mg/dL està dins d'aquest rang."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 5",
       q:"Just abans de sortir a escena, el cor de l'Anna batega molt de pressa i els seus músculs estan tensos, llestos per al primer pas. Quin sistema de regulació ha activat aquesta resposta ràpida?",
       opts:["a) El sistema endocrí, alliberant insulina","b) El sistema nerviós, mitjançant impulsos elèctrics ràpids","c) El sistema digestiu, absorbint nutrients","d) El sistema limfàtic, drenant líquids"], correct:1,
       expl:"El sistema nerviós genera respostes ràpides i precises mitjançant impulsos elèctrics (Diapositiva 5). El sistema endocrí actua més lentament (hormones)."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 6",
       q:"Després d'una classe intensa de 90 minuts, la professora demana a les alumnes que es tombin a terra i respirin lentament durant 5 minuts. Des del punt de vista fisiològic, per què és important aquest repòs?",
       opts:["a) Perquè els músculs es quedin rígids i mantinguin la forma","b) Perquè el cos restauri les condicions homeostàtiques del medi intern (LEC)","c) Perquè la glucosa baixi a zero","d) Perquè el sistema nerviós es desconecti completament"], correct:1,
       expl:"L'activitat física trenca l'equilibri del medi intern (LEC). El període de repòs permet restaurar les condicions homeostàtiques (Diapositiva 6)."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 7",
       q:"Durant el part, les contraccions uterines provoquen l'alliberament d'oxitocina, que al seu torn provoca contraccions més fortes, que alliberen més oxitocina, fins que es produeix el naixement. Quin tipus de mecanisme és aquest?",
       opts:["a) Retroalimentació negativa","b) Homeòstasi passiva","c) Retroalimentació positiva","d) Regulació endocrina lenta"], correct:2,
       expl:"En la retroalimentació positiva, la resposta amplifica l'estímul inicial, allunyant la variable del punt d'ajust fins a completar un procés (Diapositiva 7)."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 4",
       q:"Un ballarí arriba a urgències després d'un assaig sota el sol sense beure aigua. La seva pressió arterial és 85/50 mmHg. Què indica aquest valor?",
       opts:["a) Està dins del rang normal (120/80 mmHg)","b) Està per sota del rang normal; pot indicar deshidratació","c) Està per sobre del rang normal; té hipertensió","d) La pressió arterial no es veu afectada per la hidratació"], correct:1,
       expl:"La pressió arterial normal és aproximadament 120/80 mmHg (Diapositiva 4). Un valor de 85/50 està molt per sota, la qual cosa suggereix deshidratació."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 3",
       q:"Quina de les afirmacions següents sobre el líquid extracel·lular (LEC) és correcta?",
       opts:["a) Representa el 60-65% de l'aigua corporal total","b) És el medi intern on viuen les cèl·lules i constitueix el 35-40% de l'aigua corporal","c) Es troba exclusivament dins dels vasos sanguinis","d) No participa en l'homeòstasi"], correct:1,
       expl:"El LEC constitueix el 35-40% de l'aigua corporal total i és el «medi intern» que banya les cèl·lules (Diapositiva 3)."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 5",
       q:"Durant una funció de 2 hores, el cos d'un ballarí allibera adrenalina de forma sostinguda per mantenir l'estat d'alerta. Quin sistema de regulació és responsable d'aquesta resposta perllongada?",
       opts:["a) El sistema nerviós somàtic","b) El sistema endocrí, mitjançant hormones transportades per la sang","c) El sistema muscular, mitjançant contraccions","d) El sistema ossi, mitjançant remodelació"], correct:1,
       expl:"El sistema endocrí produeix respostes lentes però duradores mitjançant hormones com l'adrenalina (Diapositiva 5)."},
      {block:0, tag:"Homeòstasi", tagColor:"#667eea", ref:"Presentació I · Diapositiva 4",
       q:"Després d'un exercici molt intens, el pH sanguini d'un ballarí baixa temporalment a 7,30. Què significa això?",
       opts:["a) Que la seva sang s'ha tornat massa bàsica (alcalina)","b) Que la seva sang s'ha tornat lleugerament més àcida del normal (rang: 7,35-7,45)","c) Que el seu pH és completament normal","d) Que la glucosa ha pujat massa"], correct:1,
       expl:"El pH normal és 7,35-7,45 (Diapositiva 4). Un valor de 7,30 està per sota, indicant acidosi lleu."},

      // BLOQUE 2
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 8",
       q:"Una ballarina utilitza els seus quàdriceps per saltar, el seu cor per bombejar sang i el seu estómac per digerir el menjar. Quins tipus de teixit muscular corresponen a cada acció, en aquest ordre?",
       opts:["a) Llis, cardíac, esquelètic","b) Esquelètic, llis, cardíac","c) Esquelètic, cardíac, llis","d) Cardíac, esquelètic, llis"], correct:2,
       expl:"Quàdriceps = múscul esquelètic (voluntari). Cor = múscul cardíac (involuntari, estriat). Estómac = múscul llis (involuntari, no estriat) (Diapositiva 8)."},
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 9",
       q:"En observar una fibra muscular esquelètica al microscopi, quines característiques la distingeixen d'altres cèl·lules del cos?",
       opts:["a) És petita, esfèrica i té un sol nucli","b) És allargada, cilíndrica i multinucleada","c) És plana i sense nucli","d) Té forma d'estrella amb moltes prolongacions"], correct:1,
       expl:"La fibra muscular esquelètica és una cèl·lula allargada, cilíndrica i multinucleada (Diapositiva 9)."},
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 10",
       q:"Quina és la unitat funcional i contràctil bàsica del múscul esquelètic?",
       opts:["a) La fibra muscular","b) La miofibril·la","c) El sarcòmer","d) El miofilament d'actina"], correct:2,
       expl:"El sarcòmer és la unitat funcional i contràctil bàsica, definit com el segment entre dues línies Z consecutives (Diapositiva 10)."},
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 11",
       q:"Durant una contracció muscular, què passa amb la Banda A del sarcòmer?",
       opts:["a) S'estreta fins a desaparèixer","b) S'allarga el doble","c) Roman constant, ja que correspon a la longitud de la miosina","d) Es divideix en dues bandes més petites"], correct:2,
       expl:"La Banda A (longitud dels filaments gruixuts de miosina) roman constant durant la contracció. El que s'estreta és la Banda I (Diapositiva 11)."},
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 11",
       q:"Quan un ballarí contreu el seu bíceps braquial per aixecar el braç en un <em>port de bras</em>, què passa amb la Banda I dels seus sarcòmers?",
       opts:["a) S'eixampla perquè les línies Z se separen","b) S'estreta perquè les línies Z s'acosten","c) No canvia en absolut","d) Desapareix i es converteix en Banda A"], correct:1,
       expl:"Durant la contracció, els filaments d'actina llisquen cap al centre del sarcòmer, apropant les línies Z (Diapositiva 11)."},
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 10",
       q:"Quins són els dos tipus de miofilaments que componen el sarcòmer?",
       opts:["a) Col·lagen (gruixut) i elastina (prim)","b) Miosina (gruixut) i actina (prim)","c) Queratina (gruixut) i tubulina (prim)","d) Fibrina (gruixut) i globulina (prim)"], correct:1,
       expl:"Els miofilaments gruixuts estan formats per miosina i els prims per actina (Diapositiva 10)."},
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 11",
       q:"S'estima que el múscul bíceps braquial conté aproximadament 100.000 sarcòmers alineats en sèrie. Què implica això per a la contracció?",
       opts:["a) Que cada sarcòmer es contreu de forma independent i desordenada","b) Que l'escurçament de cada sarcòmer se suma, produint un escurçament total significatiu del múscul","c) Que només es contreuen els sarcòmers dels extrems","d) Que els sarcòmers s'allarguen durant la contracció"], correct:1,
       expl:"Al estar en sèrie, el petit escurçament de cada un dels ~100.000 sarcòmers se suma (Diapositiva 11)."},
      {block:1, tag:"Múscul i Sarcòmer", tagColor:"#11998e", ref:"Presentació I · Diapositiva 10",
       q:"Ordena de major a menor les estructures següents del múscul esquelètic:",

{block:1, tag:"Músculo y Sarcómero", tagColor:"#11998e", ref:"Presentación I · Diapositiva 11",
 q:"¿Qué estructuras delimitan un sarcómero?",
 opts:["a) Dos bandas A consecutivas","b) Dos líneas Z consecutivas","c) Una banda I y una banda H","d) Dos discos intercalares"], correct:1,
 expl:"El sarcómero se define como el segmento comprendido entre dos líneas Z consecutivas. Las líneas Z son los puntos de anclaje de los filamentos de actina (Diapositiva 11)."},

// BLOQUE 3
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 12",
 q:"¿Qué es una unidad motora?",
 opts:["a) Todo el músculo esquelético y su nervio principal","b) Una motoneurona junto con todas las fibras musculares que inerva","c) Un sarcómero y su línea Z","d) La unión entre dos músculos sinergistas"], correct:1,
 expl:"La unidad motora está formada por una motoneurona (del asta anterior de la médula espinal) y el conjunto de fibras musculares que esa neurona controla (Diapositiva 12: La unidad motora)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 12",
 q:"¿Dónde se encuentran las motoneuronas que dan la orden de contracción a los músculos esqueléticos?",
 opts:["a) En la corteza cerebral exclusivamente","b) En el asta anterior de la médula espinal","c) En los ganglios linfáticos","d) En el interior de las fibras musculares"], correct:1,
 expl:"Las motoneuronas que inervan el músculo esquelético tienen su cuerpo celular en el asta anterior de la médula espinal (Diapositiva 12). Desde allí, su axón viaja hasta el músculo."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 13",
 q:"En la unión neuromuscular, ¿qué sustancia química se libera desde la terminal del nervio para transmitir la señal a la fibra muscular?",
 opts:["a) Adrenalina","b) Dopamina","c) Acetilcolina","d) Insulina"], correct:2,
 expl:"La acetilcolina es el neurotransmisor que se libera en la unión neuromuscular (placa motora). Se une a receptores de la fibra muscular y desencadena el potencial de acción que viaja por los túbulos T (Diapositiva 13)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 13",
 q:"¿Qué ion se libera desde los depósitos internos de la fibra muscular y es imprescindible para que la actina y la miosina se unan?",
 opts:["a) Sodio (Na⁺)","b) Potasio (K⁺)","c) Calcio (Ca²⁺)","d) Cloro (Cl⁻)"], correct:2,
 expl:"El calcio (Ca²⁺) se libera desde el retículo sarcoplasmático cuando llega el potencial de acción por los túbulos T. El Ca²⁺ se une a la troponina, descubriendo los sitios de unión de la actina para la miosina (Diapositiva 13)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 14",
 q:"¿Cuál es el papel esencial del ATP en el ciclo de contracción muscular?",
 opts:["a) Unir la actina a la miosina de forma permanente","b) Liberar calcio del retículo sarcoplasmático","c) Desacoplar la miosina de la actina para permitir un nuevo ciclo","d) Degradar la acetilcolina en la sinapsis"], correct:2,
 expl:"El ATP es necesario para que la cabeza de miosina se suelte de la actina después del golpe de fuerza. Sin ATP, la miosina queda unida a la actina de forma permanente (como ocurre en el rigor mortis) (Diapositiva 14)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 15",
 q:"¿Por qué se produce el <em>rigor mortis</em> (rigidez cadavérica) después de la muerte?",
 opts:["a) Porque el calcio desaparece de las células","b) Porque la acetilcolina se acumula en la sinapsis","c) Porque al no haber ATP, la miosina no puede desacoplarse de la actina","d) Porque los huesos se fusionan con los músculos"], correct:2,
 expl:"Tras la muerte, las células dejan de producir ATP. Sin ATP, las cabezas de miosina no pueden soltarse de la actina, y los músculos quedan rígidos de forma permanente (Diapositiva 15: Rigor mortis)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 15",
 q:"Una bailarina ha ensayado 5 horas seguidas sin beber agua ni comer. De repente, su gemelo se contrae de forma involuntaria y dolorosa. ¿Qué cuadro clínico describe mejor esta situación?",
 opts:["a) Rigor mortis","b) Rampa muscular (calambre)","c) Fractura por estrés","d) Tendinitis aguda"], correct:1,
 expl:"Las rampas musculares son contracciones involuntarias causadas por hiperexcitabilidad de la motoneurona alfa, asociadas a fatiga, deshidratación o pérdida de electrolitos (Diapositiva 15)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 16",
 q:"Durante la fase de subida de un <em>relevé</em>, los gemelos se acortan mientras generan tensión. ¿Qué tipo de contracción es esta?",
 opts:["a) Excéntrica","b) Isométrica","c) Concéntrica","d) Pasiva"], correct:2,
 expl:"En la contracción concéntrica, la tensión generada por el músculo supera la resistencia, y el músculo se acorta. Es lo que ocurre en los gemelos al subir al relevé (Diapositiva 16)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 16",
 q:"Cuando un bailarín baja lentamente desde un <em>relevé</em> controlando el descenso, sus gemelos generan tensión mientras se alargan. ¿Qué tipo de contracción realizan?",
 opts:["a) Concéntrica","b) Isométrica","c) Excéntrica","d) Estática"], correct:2,
 expl:"En la contracción excéntrica, el músculo genera fuerza mientras se alarga (frena el movimiento). Es la fase de descenso controlado del relevé (Diapositiva 16)."},
{block:2, tag:"Contracción y Unidad Motora", tagColor:"#ee5a6f", ref:"Presentación I · Diapositiva 16",
 q:"Una bailarina mantiene un <em>arabesque</em> estático durante 8 tiempos. Su cuádriceps está tenso pero no cambia de longitud. ¿Qué tipo de contracción predomina?",
 opts:["a) Concéntrica","b) Isométrica","c) Excéntrica","d) Balística"], correct:1,
 expl:"En la contracción isométrica, la tensión generada iguala la resistencia y el músculo no cambia de longitud apreciablemente. Es típica del mantenimiento de posturas estáticas (Diapositiva 16)."},

// BLOQUE 4
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 1",
 q:"¿Cuáles son los cinco componentes clave de la cadena biomecánica del sistema musculoesquelético?",
 opts:["a) Cerebro, nervios, músculos, huesos, piel","b) Músculo, tendón, hueso, articulación, ligamento","c) Sangre, linfa, músculo, hueso, cartílago","d) Músculo, fascia, piel, hueso, nervio"], correct:1,
 expl:"Los cinco componentes son: Músculo (genera tensión), Tendón (une músculo a hueso), Hueso (palanca), Articulación (permite movimiento) y Ligamento (une hueso con hueso) (Pres II, Sección 1)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 1",
 q:"¿Cuál es la función principal del tendón en la cadena biomecánica?",
 opts:["a) Generar la contracción muscular","b) Unir un hueso con otro hueso","c) Unir el músculo al hueso y transmitir la fuerza muscular","d) Producir líquido sinovial"], correct:2,
 expl:"El tendón es tejido conectivo que une el músculo al hueso y transmite la fuerza generada por la contracción muscular hasta el hueso, produciendo el movimiento (Pres II, Sección 1)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 1",
 q:"¿Qué diferencia fundamental hay entre un tendón y un ligamento?",
 opts:["a) El tendón une músculo a hueso; el ligamento une hueso a hueso","b) El tendón une hueso a hueso; el ligamento une músculo a hueso","c) No hay diferencia; son lo mismo","d) El tendón es elástico y el ligamento es rígido"], correct:0,
 expl:"El tendón une músculo a hueso (transmite fuerza). El ligamento une hueso con hueso (estabiliza y limita el movimiento articular) (Pres II, Sección 1)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 2",
 q:"Cuando decimos que el músculo es el «tejido contráctil» del sistema musculoesquelético, ¿qué significa exactamente?",
 opts:["a) Que es el único tejido que puede estirarse","b) Que es capaz de generar tensión activa para producir, controlar o estabilizar el movimiento","c) Que solo sirve para mover los huesos","d) Que se contrae de forma involuntaria siempre"], correct:1,
 expl:"El músculo esquelético genera tensión activa (mediante la contracción de sus sarcómeros) para producir movimiento, controlarlo o estabilizar las articulaciones (Pres II, Sección 1 y 2)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 5",
 q:"¿Qué es la coactivación muscular?",
 opts:["a) La contracción de un solo músculo de forma aislada","b) El trabajo coordinado y simultáneo de grupos musculares para lograr estabilidad y control postural","c) La relajación total de todos los músculos","d) La contracción involuntaria de un músculo fatigado"], correct:1,
 expl:"La coactivación muscular es el trabajo coordinado de varios grupos musculares (agonistas, antagonistas, sinergistas) que permite la estabilidad y el control postural durante el movimiento (Pres II, Sección 5)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 5",
 q:"Una bailarina mantiene el equilibrio sobre una pierna en <em>passé relevé</em>. ¿Qué mecanismo fisiológico le permite no caerse?",
 opts:["a) Solo la fuerza del cuádriceps de la pierna de apoyo","b) La coactivación de múltiples grupos musculares (tobillo, cadera, tronco) que ajustan constantemente la postura","c) La rigidez de los huesos del pie","d) La relajación completa de los músculos de la pierna elevada"], correct:1,
 expl:"El equilibrio en una posición compleja requiere la coactivación coordinada de músculos del tobillo, cadera, tronco y core, que realizan microajustes constantes para mantener la estabilidad (Pres II, Sección 5)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 1",
 q:"En la cadena biomecánica, ¿qué papel desempeñan los huesos?",
 opts:["a) Generar la fuerza del movimiento","b) Actuar como palancas rígidas que sostienen el cuerpo, protegen órganos y transmiten fuerzas","c) Unir los músculos entre sí","d) Producir líquido sinovial para las articulaciones"], correct:1,
 expl:"Los huesos son estructuras rígidas y dinámicas que sostienen el cuerpo, protegen órganos vitales y actúan como palancas para el movimiento (Pres II, Sección 1)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 3",
 q:"Cuando un músculo se contrae, ¿qué ocurre realmente a nivel de sus proteínas?",
 opts:["a) Las proteínas de actina y miosina se encogen individualmente","b) Las proteínas de actina y miosina se deslizan unas sobre otras, acercando las líneas Z","c) Las proteínas se disuelven y se regeneran","d) Las proteínas de colágeno se estiran"], correct:1,
 expl:"El músculo no se «encoge» en su estructura proteica. Lo que ocurre es que los filamentos de actina y miosina se deslizan unos sobre otros, acercando las líneas Z y acortando el sarcómero (Pres II, Sección 3)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 4",
 q:"En un <em>grand plié</em>, ¿qué tipo de contracción realizan los cuádriceps durante la fase de descenso?",
 opts:["a) Concéntrica, porque se acortan","b) Isométrica, porque no cambian de longitud","c) Excéntrica, porque generan tensión mientras se alargan para frenar el descenso","d) No realizan ninguna contracción"], correct:2,
 expl:"Durante el descenso del plié, los cuádriceps se alargan pero generan tensión para controlar la velocidad de bajada (frenan la gravedad). Esto es una contracción excéntrica (Pres II, Sección 4)."},
{block:3, tag:"Biomecánica", tagColor:"#f7971e", ref:"Presentación II · Sección 5",
 q:"¿Por qué se dice que «los músculos trabajan en equipo»?",
 opts:["a) Porque todos los músculos del cuerpo se contraen a la vez","b) Porque para cualquier movimiento se necesita la coordinación de agonistas, antagonistas y sinergistas","c) Porque los músculos comparten la misma motoneurona","d) Porque los músculos se comunican mediante hormonas"], correct:1,
 expl:"Ningún músculo trabaja aislado. Para cada movimiento, un grupo de músculos (agonistas) produce la acción, otros (antagonistas) la controlan, y otros (sinergistas) la estabilizan (Pres II, Sección 5)."},

// BLOQUE 5
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 6",
 q:"¿Qué tipo de hueso es el fémur y cuál es su función principal en la danza?",
 opts:["a) Hueso corto; aporta estabilidad al pie","b) Hueso plano; protege los órganos internos","c) Hueso largo; actúa como palanca para el movimiento","d) Hueso sesamoideo; modifica la dirección de la fuerza"], correct:2,
 expl:"El fémur es un hueso largo. Los huesos largos actúan como palancas y soportan el movimiento, lo que es esencial para saltos, extensiones y desplazamientos en danza (Pres II, Sección 6)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 6",
 q:"Los huesos del tarso (en el pie) y del carpo (en la mano) se clasifican como:",
 opts:["a) Huesos largos","b) Huesos cortos","c) Huesos planos","d) Huesos irregulares"], correct:1,
 expl:"Los huesos cortos (carpo, tarso) tienen forma aproximadamente cúbica. Aportan estabilidad y permiten pequeños desplazamientos, esenciales para la articulación del pie en danza (Pres II, Sección 6)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 6",
 q:"¿Cuál es la función principal de los huesos planos como la escápula, el esternón o las costillas?",
 opts:["a) Actuar como palancas para el movimiento","b) Proteger órganos y ofrecer amplia superficie de inserción muscular","c) Modificar la dirección de la fuerza muscular","d) Permitir pequeños desplazamientos"], correct:1,
 expl:"Los huesos planos protegen órganos vitales (cráneo → cerebro, costillas → pulmones/corazón) y ofrecen una amplia superficie para la inserción de músculos (Pres II, Sección 6)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 6",
 q:"La rótula es un hueso que se desarrolla dentro del tendón del cuádriceps. ¿Cómo se clasifica?",
 opts:["a) Hueso largo","b) Hueso irregular","c) Hueso sesamoideo","d) Hueso plano"], correct:2,
 expl:"Los huesos sesamoideos se desarrollan dentro de tendones para modificar la dirección o el brazo de palanca de la fuerza muscular. La rótula es el ejemplo más conocido (Pres II, Sección 6)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 7",
 q:"¿Qué parte del hueso largo corresponde a los extremos y está compuesta principalmente por hueso esponjoso?",
 opts:["a) Diáfisis","b) Metáfisis","c) Epífisis","d) Periostio"], correct:2,
 expl:"Las epífisis son los extremos del hueso largo, compuestas principalmente por hueso esponjoso. Participan en la formación de las articulaciones (Pres II, Sección 7)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 7",
 q:"¿Qué es la diáfisis de un hueso largo?",
 opts:["a) El extremo articular del hueso","b) La zona de transición con la placa de crecimiento","c) La parte central y alargada, formada por hueso compacto que rodea la cavidad medular","d) La capa externa de tejido conectivo"], correct:2,
 expl:"La diáfisis es la parte central (caña) del hueso largo, formada por hueso compacto que rodea la cavidad medular. Es la zona que soporta las mayores cargas mecánicas (Pres II, Sección 7)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 7",
 q:"Una bailarina adolescente de 14 años aún está creciendo. ¿En qué zona de sus huesos largos se encuentra la placa de crecimiento activa?",
 opts:["a) En la epífisis","b) En la diáfisis","c) En la metáfisis","d) En la cavidad medular"], correct:2,
 expl:"La metáfisis es la zona de transición entre la epífisis y la diáfisis que contiene la placa de crecimiento (cartílago de crecimiento) durante la etapa de desarrollo (Pres II, Sección 7)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 8",
 q:"¿Cuál es la diferencia entre la médula ósea roja y la amarilla?",
 opts:["a) La roja produce células sanguíneas; la amarilla es tejido adiposo (grasa)","b) La roja es grasa; la amarilla produce células sanguíneas","c) No hay diferencia; ambas producen sangre","d) La roja está en la diáfisis; la amarilla en la epífisis"], correct:0,
 expl:"La médula ósea roja produce células sanguíneas (hematopoyesis). La médula ósea amarilla es tejido adiposo de reserva energética. Ambas se encuentran en la cavidad medular (Pres II, Sección 8)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 11",
 q:"Una bailarina que entrena <em>pointe work</em> diariamente durante años desarrolla huesos del pie más densos y resistentes. ¿Qué proceso fisiológico explica esto?",
 opts:["a) El hueso es un tejido estático que no cambia","b) La remodelación ósea: el hueso se adapta y refuerza según la carga mecánica recibida","c) Los huesos del pie se fusionan con los del tobillo","d) El cartílago se convierte en músculo"], correct:1,
 expl:"El hueso es un tejido dinámico que se adapta y remodela continuamente según la magnitud y frecuencia de la carga mecánica (Ley de Wolff). Más carga = más densidad ósea (Pres II, Sección 11)."},
{block:4, tag:"Sistema Óseo", tagColor:"#6a11cb", ref:"Presentación II · Sección 9",
 q:"¿Cuál de las siguientes NO es una función del sistema esquelético?",
 opts:["a) Soporte mecánico del cuerpo","b) Protección de órganos vitales","c) Producción de hormonas del crecimiento","d) Reservorio de minerales (calcio, fósforo)"], correct:2,
 expl:"Las funciones del esqueleto son: soporte, protección, reservorio mineral y facilitación del movimiento. La producción de hormonas del crecimiento corresponde al sistema endocrino (hipófisis), no al esqueleto (Pres II, Sección 9)."},

// BLOQUE 6
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 12",
 q:"¿Cuáles son los tres tipos principales de articulaciones según su grado de movilidad?",
 opts:["a) Rígidas, semirrígidas y elásticas","b) Fibrosas, cartilaginosas y sinoviales","c) Largas, cortas y planas","d) Simples, compuestas y complejas"], correct:1,
 expl:"Las articulaciones se clasifican en: fibrosas (poca o nula movilidad), cartilaginosas (movilidad limitada) y sinoviales (gran movilidad, como la rodilla o la cadera) (Pres II, Sección 12)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 12",
 q:"La articulación de la cadera, que permite al bailarín hacer <em>grand battement</em> en todas las direcciones, es de tipo:",
 opts:["a) Fibrosa (inmóvil)","b) Cartilaginosa (semimóvil)","c) Sinovial (móvil)","d) Sesamoidea"], correct:2,
 expl:"La cadera es una articulación sinovial de tipo enartrosis (bola y cavidad), lo que le permite un amplio rango de movimiento en todos los planos, esencial para la danza (Pres II, Sección 12)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 13",
 q:"¿Qué estructura articular actúa como amortiguador entre los huesos y reduce la fricción durante el movimiento?",
 opts:["a) El ligamento","b) El tendón","c) El cartílago articular","d) La cápsula articular"], correct:2,
 expl:"El cartílago articular recubre los extremos óseos dentro de la articulación, actuando como amortiguador y reduciendo la fricción entre las superficies óseas durante el movimiento (Pres II, Sección 13)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 13",
 q:"¿Qué función cumple el líquido sinovial dentro de una articulación?",
 opts:["a) Unir los huesos entre sí","b) Nutrir el cartílago y lubricar la articulación para reducir la fricción","c) Generar la contracción muscular","d) Producir células sanguíneas"], correct:1,
 expl:"El líquido sinovial, contenido dentro de la cápsula articular, lubrica las superficies articulares y nutre el cartílago articular (que carece de vasos sanguíneos) (Pres II, Sección 13)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 14",
 q:"El cartílago articular no tiene vasos sanguíneos. ¿Cómo obtiene sus nutrientes?",
 opts:["a) A través de los nervios que lo rodean","b) Mediante la alternancia de carga (compresión que expulsa agua) y descarga (reabsorción de líquido sinovial)","c) No necesita nutrientes porque es un tejido muerto","d) A través de los tendones que se insertan en él"], correct:1,
 expl:"Al ser avascular, el cartílago se nutre por un mecanismo de «esponja»: la compresión expulsa agua y solutos, y la descarga permite la reabsorción de líquido sinovial rico en nutrientes (Pres II, Sección 14)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 14",
 q:"¿Por qué es importante que un bailarín no permanezca inmóvil durante muchas horas y alterne períodos de actividad con reposo?",
 opts:["a) Porque los huesos se ablandan si no se mueven","b) Porque el cartílago necesita la alternancia carga-descarga para nutrirse; sin movimiento, se degenera","c) Porque los ligamentos se acortan permanentemente","d) Porque el líquido sinovial se evapora"], correct:1,
 expl:"El cartílago articular necesita movimiento y carga para nutrirse. La inmovilidad prolongada impide el mecanismo de compresión-reabsorción, lo que puede llevar a la degeneración del cartílago (Pres II, Sección 14)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 13",
 q:"¿Qué estructura envuelve la articulación sinovial y mantiene el líquido sinovial en su interior?",
 opts:["a) El periostio","b) La cápsula articular","c) El tendón","d) La fascia muscular"], correct:1,
 expl:"La cápsula articular es una envoltura de tejido conectivo que rodea la articulación sinovial, sellando el espacio articular y conteniendo el líquido sinovial (Pres II, Sección 13)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 12",
 q:"Las suturas del cráneo son articulaciones que no permiten movimiento. ¿De qué tipo son?",
 opts:["a) Sinoviales","b) Cartilaginosas","c) Fibrosas","d) Sesamoideas"], correct:2,
 expl:"Las suturas del cráneo son articulaciones fibrosas: los huesos están unidos por tejido fibroso denso y no permiten movimiento (o muy poco). Su función es proteger el cerebro (Pres II, Sección 12)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 13",
 q:"¿Qué papel desempeñan los ligamentos en una articulación?",
 opts:["a) Generar la fuerza del movimiento","b) Producir líquido sinovial","c) Unir hueso con hueso, estabilizando y limitando el movimiento articular","d) Nutrir el cartílago articular"], correct:2,
 expl:"Los ligamentos son bandas de tejido conectivo que unen un hueso con otro, contribuyendo a la estabilidad articular y limitando los movimientos excesivos que podrían causar lesión (Pres II, Secciones 1 y 13)."},
{block:5, tag:"Articulaciones", tagColor:"#fc4a1a", ref:"Presentación II · Sección 14",
 q:"Un bailarín que siempre entrena sobre superficies muy duras y nunca varía la carga sobre sus rodillas tiene mayor riesgo de desgaste del cartílago. ¿Por qué?",
 opts:["a) Porque el cartílago se endurece con la carga","b) Porque la carga excesiva y repetitiva sin descarga adecuada impide la nutrición del cartílago y acelera su degeneración","c) Porque los huesos se rompen antes que el cartílago","d) Porque el líquido sinovial se congela"], correct:1,
 expl:"El cartílago necesita alternancia de carga y descarga. La sobrecarga crónica sin períodos de recuperación comprime el cartílago de forma continua, impidiendo la reabsorción de nutrientes y acelerando el desgaste (Pres II, Sección 14)."},

// BLOQUE 7
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 15",
 q:"¿En qué plano de movimiento ocurre la rotación externa de la cadera (<em>en dehors</em>)?",
 opts:["a) Plano sagital","b) Plano frontal","c) Plano transversal","d) Plano oblicuo"], correct:2,
 expl:"Las rotaciones (tanto externa como interna) ocurren en el plano transversal, que divide el cuerpo en parte superior e inferior. El eje de rotación es vertical (longitudinal) (Pres II, Sección 15)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 15",
 q:"¿Qué significa <em>en dedans</em> en términos de movimiento?",
 opts:["a) Rotación externa: la cara anterior de la extremidad se aleja de la línea media","b) Rotación interna: la cara anterior de la extremidad gira hacia el centro del cuerpo","c) Flexión de la cadera hacia delante","d) Extensión de la pierna hacia atrás"], correct:1,
 expl:"<em>En dedans</em> = rotación interna. La extremidad gira hacia adentro, orientando su cara anterior hacia la línea media del cuerpo. Es la posición neutra/paralela en danza contemporánea (Pres II, Sección 15)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 15",
 q:"Un <em>demi-plié</em> en primera posición implica principalmente flexión de rodillas y caderas. ¿En qué plano ocurre este movimiento?",
 opts:["a) Plano transversal","b) Plano frontal","c) Plano sagital","d) Plano oblicuo"], correct:2,
 expl:"La flexión y extensión (doblar y estirar) ocurren en el plano sagital, que divide el cuerpo en mitad izquierda y derecha. El <em>plié</em> es una flexión de rodillas, caderas y tobillos (Pres II, Sección 15)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 15",
 q:"Cuando un bailarín eleva la pierna lateralmente en <em>à la seconde</em> (hacia el lado), ¿en qué plano se mueve principalmente?",
 opts:["a) Plano sagital","b) Plano frontal","c) Plano transversal","d) Plano diagonal"], correct:1,
 expl:"La abducción (separar la pierna hacia el lado) ocurre en el plano frontal, que divide el cuerpo en parte anterior y posterior (Pres II, Sección 15)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 15",
 q:"El <em>turnout</em> de cadera en ballet clásico es un ejemplo de:",
 opts:["a) Rotación interna en el plano sagital","b) Flexión en el plano frontal","c) Rotación externa en el plano transversal","d) Abducción en el plano transversal"], correct:2,
 expl:"El <em>turnout</em> es la rotación externa de la cadera: la cara anterior del muslo gira hacia afuera, alejándose de la línea media. Ocurre en el plano transversal (Pres II, Sección 15)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 16",
 q:"¿Qué es la propiocepción?",
 opts:["a) La capacidad de ver los propios pies mientras se baila","b) La capacidad inconsciente de percibir la posición y el movimiento del cuerpo mediante mecanorreceptores","c) La capacidad de escuchar la música y seguir el ritmo","d) La capacidad de estirar los músculos al máximo"], correct:1,
 expl:"La propiocepción es el sentido que permite percibir de forma inconsciente la posición, el movimiento y la fuerza de las partes del cuerpo, gracias a mecanorreceptores en músculos, tendones y articulaciones (Pres II, Sección 16)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 16",
 q:"¿Dónde se encuentran los mecanorreceptores que informan al cerebro sobre la posición del cuerpo?",
 opts:["a) Solo en la piel","b) Solo en el cerebro","c) En músculos, tendones y articulaciones","d) Solo en los huesos"], correct:2,
 expl:"Los mecanorreceptores propioceptivos se encuentran en los músculos (husos musculares), tendones (órganos tendinosos de Golgi) y articulaciones (receptores capsulares) (Pres II, Sección 16)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 16",
 q:"Una bailarina hace una <em>pirouette</em> con los ojos cerrados y aun así mantiene el equilibrio. ¿Qué sistema sensorial le permite saber dónde están sus brazos y su pierna en <em>passé</em> sin mirarlos?",
 opts:["a) El sistema visual","b) El sistema auditivo","c) El sistema propioceptivo (control sensoriomotor)","d) El sistema digestivo"], correct:2,
 expl:"El sistema propioceptivo funciona de forma inconsciente y no depende de la visión. Los mecanorreceptores informan al cerebro de la posición de cada segmento corporal en todo momento (Pres II, Sección 16)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 15",
 q:"En danza contemporánea, cuando se trabaja en posición paralela (pies mirando al frente), la cadera está en:",
 opts:["a) Rotación externa máxima (<em>en dehors</em>)","b) Posición neutra / rotación interna relativa (<em>en dedans</em>)","c) Flexión máxima","d) Abducción completa"], correct:1,
 expl:"La posición paralela en danza contemporánea corresponde a una posición neutra de la cadera, que en relación con el <em>turnout</em> del ballet se considera <em>en dedans</em> (rotación interna o neutra) (Pres II, Sección 15)."},
{block:6, tag:"Planos y Propiocepción", tagColor:"#0f2027", ref:"Presentación II · Sección 16",
 q:"¿Por qué es importante entrenar la propiocepción en la formación de un bailarín?",
 opts:["a) Para aumentar la masa muscular","b) Para mejorar la flexibilidad de los huesos","c) Para mejorar el control del movimiento, la estabilidad y la prevención de lesiones","d) Para aumentar la velocidad de contracción muscular"], correct:2,
 expl:"Un buen control propioceptivo permite al bailarín ajustar su postura y movimiento de forma precisa e inconsciente, mejorando la estabilidad, la calidad técnica y reduciendo el riesgo de lesiones (Pres II, Sección 16)."}
];

// Assignar dades originals a totes les llengües
translations.ca.data = DATA_ORIGINAL;
translations.es.data = DATA_ORIGINAL;
translations.en.data = DATA_ORIGINAL;

// ===================== ESTAT GLOBAL =====================
let currentLang = 'ca';
let currentBlock = 0;
let answered = {};
let DATA = DATA_ORIGINAL;

// ===================== LÒGICA =====================
function buildBlocks(){
  const t = translations[currentLang];
  const c = document.getElementById('blocksContainer');
  let html = '';
  t.blockNames.forEach((b,bi) => {
    const cases = t.data.filter(d => d.block === bi);
    html += `<div class="block" id="block${bi}">
      <div class="block-header bh${bi+1}">${bi+1}. ${b.name}<small>${b.ref} · 10 casos</small></div>
      <div class="block-body">`;
    cases.forEach((cs,ci) => {
      const gid = `b${bi}c${ci}`;
      const saved = answered[gid];
      html += `<div class="caso" id="caso_${gid}">
        <span class="caso-tag" style="background:${cs.tagColor}">${cs.tag}</span>
        <span style="font-size:.75em;color:#888;margin-left:8px">📖 ${cs.ref}</span>
        <h4>${t.casoLabel} ${ci+1}: ${cs.q}</h4>
        <div class="opts" id="opts_${gid}">`;
      cs.opts.forEach((o,oi) => {
        const selClass = saved && saved.sel === oi ? 'sel' : '';
        html += `<label id="lbl_${gid}_${oi}" class="${selClass}"><input type="radio" name="r_${gid}" value="${oi}" onchange="selectOpt('${gid}',${oi})"> ${o}</label>`;
      });
      html += `</div>
        <textarea class="explicacion-user" id="exp_${gid}" placeholder="${t.placeholderExp}">${saved && saved.exp ? saved.exp : ''}</textarea>
        <button class="btn-val" id="btn_${gid}" onclick="validate('${gid}',${bi},${ci})" ${saved ? 'disabled' : 'disabled'}>${saved ? t.btnValidated : t.btnValidate}</button>
        <div class="feedback" id="fb_${gid}"></div>
      </div>`;
    });
    html += `</div></div>`;
  });
  c.innerHTML = html;
  
  // Reaplicar estats de feedback per a casos ja contestats
  Object.keys(answered).forEach(gid => {
    const a = answered[gid];
    const labels = document.querySelectorAll(`#opts_${gid} label`);
    labels.forEach((l,i) => {
      l.style.pointerEvents = 'none';
      if(i === a.correct) l.classList.add('correct');
      if(i === a.sel && a.sel !== a.correct) l.classList.add('wrong');
    });
    const fb = document.getElementById(`fb_${gid}`);
    const blockIdx = parseInt(gid.match(/b(\d+)/)[1]);
    const casoIdx = parseInt(gid.match(/c(\d+)/)[1]);
    const cs = t.data.filter(d=>d.block===blockIdx)[casoIdx];
    if(a.ok){
      fb.className = 'feedback ok';
      fb.innerHTML = t.feedbackCorrect + cs.expl;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = t.feedbackWrong(cs.opts[a.correct].charAt(0)) + cs.expl;
    }
  });
}

function selectOpt(gid, oi){
  document.getElementById(`btn_${gid}`).disabled = false;
  const labels = document.querySelectorAll(`#opts_${gid} label`);
  labels.forEach(l => l.classList.remove('sel'));
  document.getElementById(`lbl_${gid}_${oi}`).classList.add('sel');
}

function validate(gid, bi, ci){
  if(answered[gid]) return;
  const t = translations[currentLang];
  const cs = t.data.filter(d => d.block===bi)[ci];
  const sel = document.querySelector(`input[name="r_${gid}"]:checked`);
  if(!sel) return;
  const val = parseInt(sel.value);
  const correct = cs.correct;
  answered[gid] = {sel: val, correct: correct, ok: val===correct, exp: document.getElementById(`exp_${gid}`).value};

  const labels = document.querySelectorAll(`#opts_${gid} label`);
  labels.forEach((l,i) => {
    l.style.pointerEvents = 'none';
    if(i === correct) l.classList.add('correct');
    if(i === val && val !== correct) l.classList.add('wrong');
  });

  const fb = document.getElementById(`fb_${gid}`);
  if(val === correct){
    fb.className = 'feedback ok';
    fb.innerHTML = t.feedbackCorrect + cs.expl;
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = t.feedbackWrong(cs.opts[correct].charAt(0)) + cs.expl;
  }

  document.getElementById(`btn_${gid}`).disabled = true;
  document.getElementById(`btn_${gid}`).textContent = t.btnValidated;
  document.getElementById(`exp_${gid}`).disabled = true;

  checkFinish();
}

function checkFinish(){
  const total = DATA.length;
  const done = Object.keys(answered).length;
  if(done === total){
    document.getElementById('endTime').disabled = false;
    document.getElementById('endTime').value = new Date().toTimeString().slice(0,5);
    showResults();
  }
}

function showResults(){
  const t = translations[currentLang];
  const total = DATA.length;
  const ok = Object.values(answered).filter(a=>a.ok).length;
  const pct = Math.round(ok/total*100);
  document.getElementById('scoreDisplay').textContent = `${ok} / ${total} (${pct}%)`;
  let detail = '';
  t.blockNames.forEach((b,bi) => {
    const cases = t.data.filter(d=>d.block===bi);
    const bok = cases.filter((_,ci)=> answered[`b${bi}c${ci}`] && answered[`b${bi}c${ci}`].ok).length;
    detail += `${b.name}: ${bok}/10 · `;
  });
  document.getElementById('scoreDetail').textContent = detail;
  document.getElementById('sendSection').style.display = 'block';
  document.getElementById('sendSection').scrollIntoView({behavior:'smooth'});
}

function navBlock(dir){
  document.getElementById(`block${currentBlock}`).classList.remove('active');
  currentBlock += dir;
  if(currentBlock < 0) currentBlock = 0;
  if(currentBlock >= translations[currentLang].blockNames.length) currentBlock = translations[currentLang].blockNames.length - 1;
  document.getElementById(`block${currentBlock}`).classList.add('active');
  updateNav();
  window.scrollTo({top: document.getElementById(`block${currentBlock}`).offsetTop - 20, behavior:'smooth'});
}

function updateNav(){
  const t = translations[currentLang];
  document.getElementById('btnPrev').disabled = currentBlock === 0;
  document.getElementById('btnPrev').textContent = t.navPrev;
  document.getElementById('btnNext').disabled = currentBlock === t.blockNames.length - 1;
  document.getElementById('btnNext').textContent = t.navNext;
  document.getElementById('progressText').textContent = t.progressText(currentBlock+1, t.blockNames.length);
}

function startTest(){
  const t = translations[currentLang];
  const name = document.getElementById('stuName').value.trim();
  const email = document.getElementById('stuEmail').value.trim();
  if(!name || !email){
    alert(t.alertFill);
    return;
  }
  document.getElementById('startTime').value = new Date().toTimeString().slice(0,5);
  document.getElementById('stuDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('personalForm').style.display = 'none';
  document.getElementById('navBar').style.display = 'flex';
  buildBlocks();
  document.getElementById(`block0`).classList.add('active');
  updateNav();
}

function sendEmail(){
  const t = translations[currentLang];
  const name = document.getElementById('stuName').value;
  const email = document.getElementById('stuEmail').value;
  const prof = document.getElementById('profEmail').value || 'professora@escuela.com';
  const date = document.getElementById('stuDate').value;
  const start = document.getElementById('startTime').value;
  const end = document.getElementById('endTime').value;
  const total = DATA.length;
  const ok = Object.values(answered).filter(a=>a.ok).length;
  const pct = Math.round(ok/total*100);

  let body = `${t.emailHeader}%0D%0A`;
  body += `${t.emailCourse}%0D%0A%0D%0A`;
  body += `${t.emailStudent}: ${name}%0D%0A`;
  body += `${t.emailEmail}: ${email}%0D%0A`;
  body += `${t.emailDate}: ${date}%0D%0A`;
  body += `${t.emailStart}: ${start}%0D%0A`;
  body += `${t.emailEnd}: ${end}%0D%0A%0D%0A`;
  body += `${t.emailResult}: ${ok}/${total} (${pct}%)%0D%0A%0D%0A`;

  t.blockNames.forEach((b,bi) => {
    body += `--- ${b.name} ---%0D%0A`;
    const cases = t.data.filter(d=>d.block===bi);
    cases.forEach((cs,ci) => {
      const gid = `b${bi}c${ci}`;
      const a = answered[gid];
      if(a){
        body += `${t.emailCase} ${ci+1}: ${a.ok?'✅':'❌'} (${t.emailAnswer}: ${cs.opts[a.sel].charAt(0)} | ${t.emailCorrect}: ${cs.opts[a.correct].charAt(0)})%0D%0A`;
        if(a.exp) body += `  ${t.emailStudentExp}: ${a.exp}%0D%0A`;
      }
    });
    body += `%0D%0A`;
  });

  const subject = encodeURIComponent(t.emailSubject(name, ok, total));
  window.location.href = `mailto:${prof}?subject=${subject}&body=${body}`;
}

// ===================== CANVI D'IDIOMA =====================
function setLang(lang){
  currentLang = lang;
  const t = translations[lang];
  DATA = t.data;
  
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  
  document.getElementById('t-top-title').textContent = t.topTitle;
  document.getElementById('t-top-sub').textContent = t.topSub;
  document.getElementById('t-form-title').textContent = t.formTitle;
  document.getElementById('t-lbl-name').textContent = t.lblName;
  document.getElementById('t-lbl-email').textContent = t.lblEmail;
  document.getElementById('t-lbl-prof').textContent = t.lblProf;
  document.getElementById('t-lbl-date').textContent = t.lblDate;
  document.getElementById('t-lbl-start').textContent = t.lblStart;
  document.getElementById('t-lbl-end').textContent = t.lblEnd;
  document.getElementById('t-btn-start').textContent = t.btnStart;
  document.getElementById('t-send-title').textContent = t.sendTitle;
  document.getElementById('t-btn-send').textContent = t.btnSend;
  document.getElementById('t-btn-print').textContent = t.btnPrint;
  
  // Si ja s'ha començat el test, reconstruir els blocs
  if(document.getElementById('navBar').style.display !== 'none'){
    buildBlocks();
    document.getElementById(`block${currentBlock}`).classList.add('active');
    updateNav();
  }
}

// Init
document.getElementById('stuDate').value = new Date().toISOString().slice(0,10);
setLang('ca');
</script>
