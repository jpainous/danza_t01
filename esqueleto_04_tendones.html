        <p>La unión miotendinosa (MTJ) es una de las estructuras más fascinantes y complejas del sistema musculoesquelético:</p>

    cases: [
      {
        header: "Case 1: The Mystery of Achilles Tendon Pain",
        desc: "<p><strong>Situation:</strong> María, a 22-year-old dancer, has had Achilles tendon pain for 3 weeks. The pain appears when she starts dancing, decreases during warm-up, but returns at the end of class. There has been no acute trauma.</p><p><strong>Question:</strong> What is the most likely physiological explanation for this pain pattern?</p>",

        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>The pattern described (pain at the start that improves with movement but reappears) is classic of a <strong>tendinopathy</strong> (previously called tendinitis, although it is not mainly inflammatory).</p>
        <p><strong>Physiological keys:</strong></p>
        <ul>
          <li><strong>Poor vascularisation:</strong> The Achilles tendon has a \"watershed\" zone (critical zone) 2-6 cm from its insertion into the calcaneus with very little blood supply. This limits its repair capacity.</li>
          <li><strong>Slow metabolic rate:</strong> Tenocytes (tendon cells) have a very low metabolic rate. New collagen synthesis takes weeks or months.</li>
          <li><strong>Load/repair imbalance:</strong> When micro-damage from overuse exceeds the repair capacity (slow due to poor vascularisation), degenerative changes accumulate.</li>
          <li><strong>The pain that \"warms up\":</strong> When moving, blood flow temporarily increases and tissue viscosity improves, but when cooling down the pain returns.</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Tendons have 7-8 times less vascularisation than muscle. That is why their injuries take 3-6 months to heal (vs. 3-6 weeks for muscle).</div>`
      },
      {
        header: "Case 2: The Paradox of Eccentric Training",
        desc: "<p><strong>Situation:</strong> Carlos, a runner, has patellar tendinopathy. His physiotherapist prescribes eccentric exercises (slow step-downs). Carlos notices that at first it hurts MORE during exercise, but at 12 weeks his tendon is much better.</p><p><strong>Question:</strong> Why are eccentric exercises, although they hurt at first, effective for tendon rehabilitation?</p>",
        opts: [
          "<strong>A)</strong> Because they stretch the tendon and make it longer and more flexible",
          "<strong>B)</strong> Because they generate high mechanical tension that stimulates tenocytes to produce more type I collagen (stronger) and reorganise the fibres in the direction of the load",
          "<strong>C)</strong> Because they relax the muscle and remove tension from the tendon"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Eccentric exercises are the \"gold standard\" for tendinopathies for specific physiological reasons:</p>
        <p><strong>Physiological mechanisms:</strong></p>
        <ul>
          <li><strong>High mechanical tension:</strong> Eccentric contraction generates 20-60% more force than concentric. This high tension is detected by tenocytes through mechanotransduction.</li>
          <li><strong>Stimulation of collagen synthesis:</strong> Tenocytes respond to mechanical load by increasing production of type I collagen (stronger and organised) vs. type III (weaker, typical of scar tissue).</li>
          <li><strong>Fibre reorientation:</strong> Collagen fibres align in the direction of the load (Wolff's law applied to tendons). Eccentric exercises promote this parallel alignment, improving tensile strength.</li>
          <li><strong>Tendon thickening:</strong> Over time (12+ weeks), the tendon increases its cross-sectional area, distributing the load better.</li>
          <li><strong>The initial pain:</strong> It is normal and does not indicate damage. It reflects tissue sensitisation, not injury.</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Tendons adapt VERY slowly. 3-4 months of progressive loading are needed to see structural changes (vs. 4-6 weeks for muscle). Patience is physiological!</div>`
      },
      {
        header: "Case 3: The Kangaroo Jump vs. the Human",
        desc: "<p><strong>Situation:</strong> A kangaroo can jump continuously using very little energy. A human who jumps repeatedly tires quickly. Both use the Achilles tendon.</p><p><strong>Question:</strong> What physiological property of the tendon explains the difference in energy efficiency?</p>",
        opts: [

          "<strong>B)</strong> The human Achilles tendon has lower elastic energy storage and return capacity (lower efficiency in the stretch-shortening cycle) compared to the kangaroo",
          "<strong>C)</strong> Kangaroos have stronger muscles"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Tendons act as <strong>biological springs</strong> that store and release elastic energy:</p>
        <p><strong>Stretch-shortening cycle (SSC) mechanism:</strong></p>
        <ul>
          <li><strong>Eccentric phase (landing):</strong> The tendon stretches and stores elastic energy (like stretching a rubber band). Up to 35% of mechanical energy can be stored.</li>
          <li><strong>Amortisation phase:</strong> Brief pause (must be <200ms for maximum efficiency).</li>
          <li><strong>Concentric phase (impulse):</strong> The tendon shortens releasing the stored energy, helping the muscle.</li>
        </ul>
        <p><strong>Kangaroo-human differences:</strong></p>
        <ul>
          <li><strong>Kangaroo:</strong> Its tendons are extremely efficient (90-95% energy return). They can jump at 20 km/h using the same energy as at 6 km/h. The tendon does most of the work!</li>
          <li><strong>Human:</strong> Our Achilles tendon has 80-90% efficiency. Better than many mammals, but worse than the kangaroo.</li>
          <li><strong>Hysteresis:</strong> It is the energy \"lost\" (dissipated as heat) in each cycle. Lower hysteresis = greater efficiency.</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> A healthy tendon can store ~50 J of energy per step when running. In an hour of running, this saves ~180 kcal. Tendons are \"biological batteries\"!</div>`
      },

        opts: [

        <p>Tendons are <strong>viscoelastic</strong> tissues: they have both viscous properties (like a thick liquid) and elastic properties (like a spring). Temperature directly affects these properties:</p>

        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Nutrition plays a crucial role in tendon health and repair, although its effect is slower than in muscle:</p>
        <p><strong>Nutritional mechanisms:</strong></p>

          </li>

        opts: [
          "<strong>A)</strong> It is just coincidence, there is no physiological reason",

          "<strong>C)</strong> Because that is where the nerves are inserted"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>The myotendinous junction (MTJ) is one of the most fascinating and complex structures of the musculoskeletal system:</p>

          </li>
          <li><strong>Special architecture:</strong>
            <ul><li>Muscle fibres end in \"finger-like\" shapes that interdigitate with the tendon.</li><li>This increases the contact surface ~10-15 times vs. a flat junction.</li><li>Adhesion proteins (integrins, dystroglycan) bind the muscle actin cytoskeleton to the tendon extracellular matrix.</li></ul>

          </li>

/* ============================================================
   ESTAT I RENDER
   ============================================================ */
let currentLang = 'ca';
let completedCases = 0;
const totalCases = 10;
let selectedAnswers = {};

function renderIntro() {
  const t = I18N[currentLang];
  document.getElementById('t-header-title').textContent = t.headerTitle;
  document.getElementById('t-header-sub').textContent = t.headerSub;
  document.getElementById('t-intro-title').textContent = t.introTitle;
  document.getElementById('t-progress-label').textContent = t.progressLabel;
  document.getElementById('t-progress-cases').textContent = t.progressCases;
  
  document.getElementById('t-intro-content').innerHTML = `
    <p>${t.introP1}</p>
    <p>${t.introP2}</p>
    <ul>${t.introUl.map(x => `<li>${x}</li>`).join('')}</ul>
    <p style="margin-top: 15px;">${t.introP3}</p>
  `;
}

function renderCases() {
  const t = I18N[currentLang];
  const container = document.getElementById('casesContainer');
  container.innerHTML = '';
  
  t.cases.forEach((c, idx) => {
    const caseNum = idx + 1;
    let html = `<div class="case" id="case${caseNum}">
      <div class="case-header">${c.header}</div>
      <div class="case-description">${c.desc}</div>
      <div class="options">`;
    c.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(65 + oi);
      html += `<div class="option" data-value="${letter}">${opt}</div>`;
    });
    html += `</div>
      <button class="btn-check" onclick="checkAnswer(${caseNum}, '${c.correct}')">${t.btnCheck}</button>
      <div class="explanation-box" id="explanation${caseNum}">
        <h4 id="fb-title${caseNum}"></h4>
        <div class="explanation-content">${c.exp}</div>
      </div>
    </div>`;
    container.innerHTML += html;
  });
  
  // Restaurar estats
  completedCases = 0;
  Object.keys(selectedAnswers).forEach(caseNum => {
    const saved = selectedAnswers[caseNum];
    const caseEl = document.getElementById(`case${caseNum}`);
    if (!caseEl) return;
    const opts = caseEl.querySelectorAll('.option');
    const btn = caseEl.querySelector('.btn-check');
    const exp = document.getElementById(`explanation${caseNum}`);
    const fbTitle = document.getElementById(`fb-title${caseNum}`);
    
    opts.forEach(o => {
      if (o.getAttribute('data-value') === saved.selected) o.classList.add('selected');
      o.style.pointerEvents = 'none';
      o.style.opacity = '0.7';
      if (o.getAttribute('data-value') === saved.correct) { o.classList.add('correct'); o.style.opacity = '1'; }
      if (o.getAttribute('data-value') === saved.selected && saved.selected !== saved.correct) { o.classList.add('incorrect'); o.style.opacity = '1'; }
    });
    btn.disabled = true;
    if (saved.selected === saved.correct) {
      exp.classList.add('correct', 'show');
      fbTitle.textContent = t.fbCorrect + ' ' + saved.correct;
      completedCases++;
    } else {
      exp.classList.add('incorrect', 'show');
      fbTitle.textContent = t.fbIncorrect + ' ' + saved.correct;
    }
  });
  
  // Afegir listeners
  container.querySelectorAll('.option').forEach(option => {
    option.addEventListener('click', function() {
      if (this.style.pointerEvents === 'none') return;
      const parent = this.parentElement;
      parent.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
      this.classList.add('selected');
    });
  });
  
  updateProgress();
}

function checkAnswer(caseNum, correctAnswer) {
  const t = I18N[currentLang];
  const caseElement = document.getElementById(`case${caseNum}`);
  const options = caseElement.querySelectorAll('.option');
  const btn = caseElement.querySelector('.btn-check');
  const explanation = document.getElementById(`explanation${caseNum}`);
  const fbTitle = document.getElementById(`fb-title${caseNum}`);
  
  btn.disabled = true;
  
  let selectedValue = null;
  options.forEach(option => {
    if (option.classList.contains('selected')) {
      selectedValue = option.getAttribute('data-value');
    }
    option.style.pointerEvents = 'none';
    option.style.opacity = '0.7';
  });
  
  if (!selectedValue) {
    alert(t.alertSelect);
    btn.disabled = false;
    options.forEach(option => {
      option.style.pointerEvents = 'auto';
      option.style.opacity = '1';
    });
    return;
  }
  
  options.forEach(option => {
    if (option.getAttribute('data-value') === correctAnswer) {
      option.classList.add('correct');
      option.style.opacity = '1';
    } else if (option.getAttribute('data-value') === selectedValue && selectedValue !== correctAnswer) {
      option.classList.add('incorrect');
      option.style.opacity = '1';
    }
  });
  
  if (selectedValue === correctAnswer) {
    explanation.classList.add('correct', 'show');
    fbTitle.textContent = t.fbCorrect + ' ' + correctAnswer;
    completedCases++;
  } else {
    explanation.classList.add('incorrect', 'show');
    fbTitle.textContent = t.fbIncorrect + ' ' + correctAnswer;
  }
  
  selectedAnswers[caseNum] = { selected: selectedValue, correct: correctAnswer };
  updateProgress();
}

function updateProgress() {
  const t = I18N[currentLang];
  const progress = (completedCases / totalCases) * 100;
  document.getElementById('progressBar').style.width = progress + '%';
  document.getElementById('progress').textContent = completedCases;
  
  if (completedCases === totalCases) {
    setTimeout(() => { alert(t.alertComplete); }, 500);
  }
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  renderIntro();
  renderCases();
}

/* Inicialització */
setLang('ca');
</script>
</body>
</html>
