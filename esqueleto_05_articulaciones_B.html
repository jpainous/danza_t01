        exp: `<p><strong>Explicació fisiològica:</strong></p>

        header: "Caso 3: El Esguince que No Se Cura",
        topic: "Propiocepción",
        desc: "<p><strong>Situación:</strong> Marta se torció el tobillo hace 3 meses. El ligamento ya está curado (confirmado por ecografía), pero sigue teniendo sensación de \"inestabilidad\" y se vuelve a torcer con frecuencia, incluso en terrenos llanos.</p><p><strong>Pregunta:</strong> Si el ligamento está curado, ¿por qué sigue sintiendo inestabilidad?</p>",
        opts: [
          "<strong>A)</strong> Porque los ligamentos nunca se curan del todo",

          "<strong>C)</strong> Porque es psicológico, no fisiológico"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>Los ligamentos no son solo "cuerdas pasivas" que estabilizan. Contienen <strong>mecanorreceptores especializados</strong> que informan al cerebro:</p>
        <p><strong>Tipos de mecanorreceptores articulares:</strong></p>
        <ul>
          <li><strong>Corpúsculos de Pacini:</strong> Detectan aceleración y cambios rápidos de posición (vibración)</li>
          <li><strong>Corpúsculos de Ruffini:</strong> Detectan estiramiento sostenido y posición estática</li>
          <li><strong>Corpúsculos de Golgi-Mazzoni:</strong> Detectan presión profunda</li>

        <p><strong>El arco reflejo artroquinético:</strong></p>
        <ul>
          <li>Los mecanorreceptores envían señales → médula espinal → músculos alrededor de la articulación</li>

        <p><strong>Consecuencia:</strong> Aunque el ligamento se cure estructuralmente, el cerebro "pierde el mapa" de la articulación. Sin información precisa, los músculos no pueden reaccionar a tiempo → inestabilidad funcional.</p>
        <div class="key-concept"><strong>💡 Concepto clave:</strong> Tras un esguince, la rehabilitación propioceptiva (ejercicios sobre superficies inestables, ojos cerrados) es ESENCIAL. Sin ella, el riesgo de recidiva es 3-5 veces mayor.</div>`

      {
        header: "Caso 4: El Menisco Roto",
        topic: "Partes de la articulación",
        desc: "<p><strong>Situación:</strong> David, futbolista de 28 años, sufre una rotura del menisco interno de la rodilla. La resonancia muestra que la rotura está en la zona central (\"zona blanca\"). El cirujano le dice que es probable que no cure sola y haya que extirpar esa parte.</p><p><strong>Pregunta:</strong> ¿Por qué la zona central del menisco no puede curarse sola?</p>",
        opts: [
          "<strong>A)</strong> Porque el menisco no tiene células",
          "<strong>B)</strong> Porque el menisco tiene 3 zonas con diferente vascularización: la zona periférica (\"roja\") tiene sangre y puede curar; la zona central (\"blanca\") es avascular y depende de la difusión del líquido sinovial, por lo que no puede formar un coágulo estable ni iniciar la reparación",
          "<strong>C)</strong> Porque los meniscos son de cartílago y no tienen capacidad de curación"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>El menisco es una estructura fibrocartilaginosa con <strong>vascularización diferencial</strong>:</p>
        <p><strong>Las 3 zonas del menisco:</strong></p>
        <ul>
          <li><strong>Zona roja-roja (periférica, 10-30%):</strong> Irrigada por la arteria genicular. Tiene capacidad de curación. Las roturas aquí pueden suturarse con buen pronóstico.</li>
          <li><strong>Zona rojo-blanca (media, 20-30%):</strong> Vascularización limitada. Curación variable.</li>
          <li><strong>Zona blanca-blanca (central, 40-50%):</strong> Avascular. Se nutre por difusión del líquido sinovial. NO puede curar porque no llega sangre (y con ella, células, factores de crecimiento, oxígeno).</li>
        </ul>
        <p><strong>Implicaciones clínicas:</strong></p>
        <ul>
          <li>Roturas en zona blanca → meniscectomía parcial (extirpar la parte dañada)</li>
          <li>Roturas en zona roja → sutura meniscal (intentar reparar)</li>
          <li>Tras meniscectomía: aumenta la presión sobre el cartílago articular (el menisco distribuye el 50% de la carga) → mayor riesgo de artrosis a largo plazo</li>
        </ul>
        <div class="key-concept"><strong>💡 Concepto clave:</strong> El menisco es como una "almohadilla con zonas": la parte de fuera tiene sangre y cura; la de dentro, no. Por eso la localización de la rotura determina el tratamiento.</div>`
      },
      {
        header: "Caso 5: El Sauté en los 3 Planos",
        topic: "Planos del movimiento",
        desc: "<p><strong>Situación:</strong> Una profesora de danza analiza un <em>sauté</em> (salto vertical con piernas juntas) de una alumna. Observa que:</p><ul><li>Al subir y bajar: las rodillas se flexionan y extienden</li><li>La alumna tiende a meter las rodillas hacia dentro (valgo)</li><li>Al aterrizar, el tronco rota ligeramente hacia un lado</li></ul><p><strong>Pregunta:</strong> ¿En qué planos del espacio ocurren estos 3 movimientos?</p>",
        opts: [
          "<strong>A)</strong> Los tres ocurren en el mismo plano",
          "<strong>B)</strong> Flexión-extensión: plano sagital (divide el cuerpo en izquierda/derecha); Valgo de rodilla (aducción): plano frontal (divide en delante/detrás); Rotación del tronco: plano transversal (divide en arriba/abajo)",
          "<strong>C)</strong> Flexión: plano frontal; Valgo: plano transversal; Rotación: plano sagital"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>El cuerpo humano se mueve en <strong>3 planos cardinales</strong>, cada uno con un eje de rotación perpendicular:</p>
        <p><strong>Los 3 planos:</strong></p>
        <ul>
          <li><strong>Plano sagital (lateral):</strong> Divide el cuerpo en mitad izquierda y derecha. Eje: transversal (mediolateral).
            <ul><li>Movimientos: flexión-extensión</li><li>Ejemplo en el sauté: flexión de rodillas al preparar el salto, extensión al impulsarse</li></ul>
          </li>
          <li><strong>Plano frontal (coronal):</strong> Divide el cuerpo en parte anterior y posterior. Eje: anteroposterior.
            <ul><li>Movimientos: abducción-aducción, inclinación lateral, eversión-inversión</li><li>Ejemplo en el sauté: valgo de rodilla (aducción de la cadera + rodilla hacia dentro)</li></ul>
          </li>
          <li><strong>Plano transversal (horizontal):</strong> Divide el cuerpo en parte superior e inferior. Eje: vertical (longitudinal).
            <ul><li>Movimientos: rotación interna-externa, pronación-supinación</li><li>Ejemplo en el sauté: rotación del tronco al aterrizar</li></ul>
          </li>
        </ul>
        <p><strong>Importancia para la técnica:</strong></p>
        <ul>
          <li>Un sauté "perfecto" debería ocurrir solo en el plano sagital</li>
          <li>El valgo (plano frontal) y la rotación (plano transversal) son compensaciones que aumentan el riesgo de lesión (especialmente del LCA)</li>
        </ul>
        <div class="key-concept"><strong>💡 Concepto clave:</strong> Todo movimiento humano es una combinación de los 3 planos. Analizar en qué plano ocurre un movimiento ayuda a identificar compensaciones y prevenir lesiones.</div>`
      },
      {
        header: "Caso 6: La Artrosis del Bailarín",
        topic: "Cartílago y carga",
        desc: "<p><strong>Situación:</strong> Rosa, bailarina de ballet de 55 años, tiene artrosis en ambas caderas. Su hermana gemela, que nunca bailó, tiene las caderas sanas. Rosa se pregunta: \"¿Bailar toda mi vida me ha causado la artrosis?\"</p><p><strong>Pregunta:</strong> ¿Cuál es la explicación fisiológica más probable?</p>",
        opts: [
          "<strong>A)</strong> Bailar siempre causa artrosis, el cartílago se \"gasta\" como una suela de zapato",
          "<strong>B)</strong> La artrosis no es solo \"desgaste\". Es un proceso biológico activo donde el equilibrio entre síntesis y degradación de matriz se rompe. En bailarines de élite, las microlesiones repetidas del cartílago (por cargas extremas y años de impacto) pueden superar la capacidad de reparación de los condrocitos, desencadenando una cascada inflamatoria que degrada el cartílago",
          "<strong>C)</strong> Es solo genética, el baile no tiene nada que ver"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>La artrosis NO es simplemente "desgaste mecánico". Es una enfermedad articular compleja con componentes biológicos activos:</p>
        <p><strong>Fisiopatología de la artrosis:</strong></p>
        <ul>
          <li><strong>Daño inicial:</strong> Microtraumatismos repetidos (años de ballet = miles de horas de carga extrema en las caderas)</li>
          <li><strong>Respuesta de los condrocitos:</strong> Inicialmente aumentan la síntesis de matriz (intento de reparación). Pero con el tiempo, se "agotan" y cambian su fenotipo.</li>
          <li><strong>Cascada inflamatoria:</strong> Los condrocitos dañados liberan citoquinas proinflamatorias (IL-1β, TNF-α) y enzimas degradantes (metaloproteinasas - MMPs, agrecanasas - ADAMTS)</li>
          <li><strong>Degradación de la matriz:</strong> Se destruye el colágeno tipo II y los proteoglicanos (agrecán)</li>
          <li><strong>Cambios óseos:</strong> El hueso subcondral se esclerosa (se hace más duro), aparecen osteofitos (picos óseos)</li>
          <li><strong>Sinovitis:</strong> La membrana sinovial se inflama, produciendo más líquido pero de peor calidad</li>
        </ul>
        <p><strong>¿Por qué Rosa sí y su hermana no?</strong></p>
        <ul>
          <li>Factores mecánicos: ballet = cargas extremas en las caderas (extensiones, rotaciones)</li>
          <li>Factores genéticos: ambas tienen la misma genética, pero el ambiente (baile de élite) "activó" la enfermedad en Rosa</li>
          <li>La paradoja: el ejercicio moderado PROTEGE el cartílago; el ejercicio extremo y repetitivo puede dañarlo</li>
        </ul>
        <div class="key-concept"><strong>💡 Concepto clave:</strong> La artrosis es una enfermedad, no solo "desgaste". El baile de élite es un factor de riesgo, pero no una condena. La clave es el equilibrio: carga adecuada + recuperación + técnica correcta.</div>`
      },
      {
        header: "Caso 7: La Hiperlaxa que No Puede Estabilizar",
        topic: "Tipos de articulaciones",
        desc: "<p><strong>Situación:</strong> Elena, bailarina de 19 años, es \"hiperlaxa\": puede poner las manos en el suelo sin doblar las rodillas, hiperextender los codos más de 10°, y hacer el spagat completo fácilmente. Pero tiene dolor crónico en rodillas y hombros, y frecuentes \"subluxaciones\" (la articulación se sale parcialmente).</p><p><strong>Pregunta:</strong> ¿Qué tipo de articulación tiene y qué problema fisiológico explica sus síntomas?</p>",
        opts: [
          "<strong>A)</strong> Tiene articulaciones fibrosas (sinartrosis) que son demasiado flexibles",
          "<strong>B)</strong> Tiene articulaciones sinoviales (diartrosis) con ligamentos demasiado laxos por alteración del colágeno (posible síndrome de Ehlers-Danlos hipermóvil). Los ligamentos no pueden estabilizar la articulación → los músculos deben trabajar en exceso → fatiga y dolor. La propiocepción también puede estar alterada",
          "<strong>C)</strong> Tiene articulaciones cartilaginosas (anfiartrosis) en todas partes"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>Las articulaciones sinoviales (diartrosis) son las más móviles del cuerpo. Su estabilidad depende de:</p>
        <p><strong>Estabilizadores pasivos (no contráctiles):</strong></p>
        <ul>
          <li><strong>Ligamentos:</strong> Limitan el rango de movimiento</li>
          <li><strong>Cápsula articular:</strong> Envuelve la articulación</li>
          <li><strong>Forma de las superficies óseas:</strong> Encaje mecánico</li>
          <li><strong>Presión negativa intraarticular:</strong> "Succión" que mantiene las superficies en contacto</li>
        </ul>
        <p><strong>Estabilizadores activos (contráctiles):</strong></p>
        <ul>
          <li><strong>Músculos:</strong> Proporcionan estabilidad dinámica</li>
          <li><strong>Tendones:</strong> Transmiten la fuerza muscular</li>
        </ul>
        <p><strong>En la hiperlaxitud:</strong></p>
        <ul>
          <li>Los ligamentos tienen colágeno alterado (defecto en la estructura del colágeno tipo III o en los enlaces cruzados)</li>
          <li>Son "demasiado elásticos" → no limitan el movimiento → la articulación es inestable</li>
          <li>Los músculos deben trabajar en exceso para compensar → fatiga, dolor, contracturas</li>
          <li>Los mecanorreceptores de los ligamentos pueden estar alterados → propiocepción deficiente</li>
          <li>Riesgo de subluxaciones y luxaciones</li>
        </ul>
        <p><strong>Tipos de articulaciones (recordatorio):</strong></p>
        <ul>
          <li><strong>Sinartrosis (fibrosas):</strong> Sin movimiento (ej: suturas del cráneo)</li>
          <li><strong>Anfiartrosis (cartilaginosas):</strong> Movimiento limitado (ej: sínfisis del pubis, discos intervertebrales)</li>
          <li><strong>Diartrosis (sinoviales):</strong> Libre movimiento (ej: rodilla, hombro, cadera) ← las de Elena</li>
        </ul>
        <div class="key-concept"><strong>💡 Concepto clave:</strong> La hiperlaxitud no es una ventaja en danza. Es un factor de riesgo. Estas bailarinas necesitan FORTALECER músculos (estabilizadores activos) porque los pasivos (ligamentos) no funcionan bien.</div>`
      },
      {
        header: "Caso 8: La Lubricina, la Molécula Escondida",
        topic: "Líquido sinovial",
        desc: "<p><strong>Situación:</strong> Un investigador estudia ratones modificados genéticamente que no producen <strong>lubricina</strong> (PRG4). Los ratones desarrollan artrosis precoz a los 2 meses de vida, a pesar de que el ácido hialurónico y el líquido sinovial son normales.</p><p><strong>Pregunta:</strong> ¿Qué función específica tiene la lubricina que explica esta artrosis precoz?</p>",
        opts: [
          "<strong>A)</strong> La lubricina es un tipo de ácido hialurónico",
          "<strong>B)</strong> La lubricina es una glucoproteína que forma una capa protectora sobre el cartílago, reduciendo el coeficiente de fricción a valores ultra-bajos (0.001-0.01, similar al hielo sobre hielo). Sin ella, el cartílago sufre fricción directa → daño mecánico → artrosis",
          "<strong>C)</strong> La lubricina nutre el cartílago"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>La lubricación articular es un sistema complejo con múltiples mecanismos:</p>
        <p><strong>Mecanismos de lubricación:</strong></p>
        <ul>
          <li><strong>Lubricación límite:</strong> Moléculas adsorbidas a la superficie del cartílago forman una capa protectora. La lubricina (PRG4) es la principal molécula de este sistema.</li>
          <li><strong>Lubricación por fluido:</strong> El líquido sinovial forma una película que separa las superficies. El ácido hialurónico es clave aquí.</li>
          <li><strong>Lubricación mixta:</strong> Combinación de ambos mecanismos.</li>
        </ul>
        <p><strong>La lubricina (PRG4):</strong></p>
        <ul>
          <li>Glucoproteína producida por los condrocitos superficiales y las células sinoviales</li>
          <li>Se adhiere a la superficie del cartílago mediante sus extremos</li>
          <li>La parte central (ricamente glucosilada) repele otras moléculas → efecto "antiadherente"</li>
          <li>Reduce el coeficiente de fricción a 0.001-0.01 (similar al hielo sobre hielo, 10-100 veces menor que el caucho sobre asfalto)</li>
          <li>También tiene función antiinflamatoria y protege contra la adhesión de células inflamatorias</li>
        </ul>
        <p><strong>Implicaciones clínicas:</strong></p>
        <ul>
          <li>Mutaciones en el gen PRG4 → síndrome CACP (artropatía por deficiencia de lubricina)</li>
          <li>En artrosis, los niveles de lubricina pueden estar alterados</li>
          <li>Investigación actual: inyecciones de lubricina como tratamiento para la artrosis</li>
        </ul>
        <div class="key-concept"><strong>💡 Concepto clave:</strong> La lubricina es el "teflón" biológico de las articulaciones. Sin ella, el cartílago se raya como una sartén antiadherente sin recubrimiento. El ácido hialurónico lubrica el fluido; la lubricina, la superficie.</div>`
      },
      {
        header: "Caso 9: El Entrenamiento Propioceptivo",
        topic: "Propiocepción",
        desc: "<p><strong>Situación:</strong> Un fisioterapeuta trabaja con un bailarín que se recuperó de una rotura del ligamento cruzado anterior (LCA). Además de fortalecer los músculos, le hace ejercicios sobre una tabla de equilibrio, con los ojos cerrados, y lanzando una pelota mientras está sobre una pata.</p><p><strong>Pregunta:</strong> ¿Qué sistema fisiológico está entrenando específicamente con estos ejercicios?</p>",
        opts: [
          "<strong>A)</strong> Solo está entrenando la fuerza muscular",
          "<strong>B)</strong> Está entrenando el sistema propioceptivo: mejora la capacidad de los mecanorreceptores (articulares, musculares, cutáneos) para detectar la posición articular, y la capacidad del SNC para procesar esa información y generar respuestas motoras rápidas y precisas. Esto se llama \"reaprendizaje neuromuscular\"",
          "<strong>C)</strong> Está entrenando la flexibilidad"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>La propiocepción es el "sexto sentido": la capacidad de percibir la posición y el movimiento del cuerpo sin usar la vista.</p>
        <p><strong>Receptores propioceptivos:</strong></p>
        <ul>
          <li><strong>Articulares:</strong> Mecanorreceptores en cápsula y ligamentos (Pacini, Ruffini, Golgi)</li>
          <li><strong>Musculares:</strong> Husos musculares (detectan longitud y velocidad de cambio)</li>
          <li><strong>Tendinosos:</strong> Órganos tendinosos de Golgi (detectan tensión)</li>
          <li><strong>Cutáneos:</strong> Receptores en la piel (presión, tacto)</li>
          <li><strong>Vestibulares:</strong> Oído interno (equilibrio y orientación de la cabeza)</li>
        </ul>
        <p><strong>Vías propioceptivas:</strong></p>
        <ul>
          <li><strong>Inconsciente:</strong> Vía espinocerebelosa → cerebelo → ajuste postural automático</li>
          <li><strong>Consciente:</strong> Vía columnas dorsales → corteza somatosensorial → percepción de la posición</li>
        </ul>
        <p><strong>Principios del entrenamiento propioceptivo:</strong></p>
        <ul>
          <li><strong>Progresión:</strong> De estable a inestable, de ojos abiertos a cerrados, de estático a dinámico</li>

          <li><strong>Neuroplasticidad:</strong> El cerebro puede "reaprender" a interpretar las señales propioceptivas tras una lesión</li>
          <li><strong>Reflejos:</strong> Se mejoran los reflejos espinales y los ajustes posturales automáticos</li>

        <div class="key-concept"><strong>💡 Concepto clave:</strong> Tras una lesión articular, no basta con fortalecer músculos. Hay que "reconectar" el sistema nervioso con la articulación. Sin entrenamiento propioceptivo, el riesgo de recidiva es altísimo.</div>`
      },
      {
        header: "Caso 10: La Diferencia entre Articulaciones",
        topic: "Tipos de articulaciones",
        desc: "<p><strong>Situación:</strong> Un estudiante de anatomía compara tres articulaciones:</p><ul><li><strong>A:</strong> Suturas del cráneo</li><li><strong>B:</strong> Sínfisis del pubis</li><li><strong>C:</strong> Rodilla</li></ul><p><strong>Pregunta:</strong> ¿Qué tipo de articulación es cada una y qué características fisiológicas las diferencian?</p>",
        opts: [

          "<strong>B)</strong> A = sinartrosis (fibrosa, sin movimiento, tejido conectivo denso); B = anfiartrosis (cartilaginosa, movimiento limitado, fibrocartílago); C = diartrosis (sinovial, libre movimiento, cavidad articular con líquido sinovial, cartílago hialino)",
          "<strong>C)</strong> A = diartrosis; B = sinartrosis; C = anfiartrosis"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>Las articulaciones se clasifican según su <strong>estructura</strong> (tipo de tejido) y su <strong>función</strong> (grado de movimiento):</p>
        
        <p><strong>A) Suturas del cráneo - SINARTROSIS (fibrosa):</strong></p>

          <li><strong>Función:</strong> Protección del encéfalo</li>

          <li><strong>Ejemplos:</strong> Suturas coronal, sagital, lambdoidea</li>

        <p><strong>B) Sínfisis del pubis - ANFIARTROSIS (cartilaginosa):</strong></p>
        <ul>
          <li><strong>Tejido:</strong> Fibrocartílago (disco interpubiano)</li>

        </ul>
        
        <p><strong>C) Rodilla - DIARTROSIS (sinovial):</strong></p>
        <ul>
          <li><strong>Tejido:</strong> Cartílago hialino + cápsula + ligamentos + líquido sinovial</li>
          <li><strong>Movimiento:</strong> Libre (flexión-extensión, rotaciones menores)</li>
          <li><strong>Estructuras especiales:</strong> Meniscos, bolsas sinoviales, grasa de Hoffa</li>
          <li><strong>Función:</strong> Movimiento con mínima fricción</li>
          <li><strong>Ejemplos:</strong> Rodilla, hombro, cadera, tobillo, codo, muñeca</li>
        </ul>
        
        <p><strong>Resumen comparativo:</strong></p>
        <table>
          <tr><th>Característica</th><th>Sinartrosis</th><th>Anfiartrosis</th><th>Diartrosis</th></tr>
          <tr><td><strong>Movimiento</strong></td><td>Ninguno</td><td>Limitado</td><td>Libre</td></tr>
          <tr><td><strong>Cavidad</strong></td><td>No</td><td>No</td><td>Sí</td></tr>
          <tr><td><strong>Líquido sinovial</strong></td><td>No</td><td>No</td><td>Sí</td></tr>
          <tr><td><strong>Ejemplo</strong></td><td>Suturas</td><td>Sínfisis pubis</td><td>Rodilla</td></tr>
        </table>
        
        <div class="key-concept"><strong>💡 Concepto clave:</strong> La clasificación articular refleja el compromiso entre estabilidad y movilidad. Las sinartrosis priorizan la protección; las diartrosis, el movimiento. Las anfiartrosis son un punto intermedio.</div>`

    cases: [
      {
        header: "Case 1: The Immobilised Dancer",
        topic: "Cartilage and movement",
        desc: "<p><strong>Situation:</strong> Lucía, a 20-year-old dancer, suffers an ankle fracture and spends 6 weeks with her leg immobilised in an orthopaedic boot. When the boot is removed, she notices her knee and ankle are \"stiff\". The MRI shows that the articular cartilage of the immobilised knee has <strong>thinned by 10%</strong> compared to the healthy leg.</p><p><strong>Question:</strong> Why has the cartilage thinned if there has been no blow or direct injury to it?</p>",
        opts: [
          "<strong>A)</strong> Because cartilage \"evaporates\" over time",
          "<strong>B)</strong> Because articular cartilage is nourished by diffusion of synovial fluid, and this process requires movement (compression-decompression cycle). Without movement, the cartilage receives no nutrients and does not eliminate waste → the cells (chondrocytes) die by apoptosis and the matrix degrades",
          "<strong>C)</strong> Because the muscles have \"eaten\" the cartilage as they weakened"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Articular cartilage is an <strong>avascular, aneural and alymphatic</strong> tissue (no blood vessels, nerves or lymphatics). This means it does NOT receive nutrients directly from the blood.</p>
        <p><strong>Diffusion nutrition mechanism:</strong></p>
        <ul>
          <li><strong>At rest:</strong> The cartilage absorbs synovial fluid rich in nutrients (glucose, oxygen, amino acids) like a dry sponge that gets wet.</li>
          <li><strong>During load (walking/dancing):</strong> Compression \"squeezes\" the cartilage, expelling fluid with metabolic waste (CO₂, lactic acid).</li>
          <li><strong>When load is removed:</strong> The cartilage reabsorbs fresh fluid with new nutrients.</li>
          <li><strong>The cycle:</strong> This mechanical \"pumping\" is ESSENTIAL. Without movement, there is no fluid exchange → chondrocytes \"suffocate\" and die.</li>
        </ul>
        <p><strong>Consequences of immobilisation:</strong></p>
        <ul>
          <li>Decreased synthesis of proteoglycans (aggrecan)</li>
          <li>Water loss from cartilage (from 80% to 70%)</li>
          <li>Chondrocyte apoptosis (programmed cell death)</li>
          <li>Cartilage thinning (up to 10-15% in 6 weeks)</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Articular cartilage \"eats when it moves\". That is why early mobilisation after injury is essential. Absolute rest is poison for cartilage.</div>`
      },
      {
        header: "Case 2: The Mystery of the Morning \"Crack\"",
        topic: "Synovial fluid",
        desc: "<p><strong>Situation:</strong> Javier, 45, notices that in the morning his joints \"crack\" and are stiff. After 10-15 minutes of movement, the stiffness disappears and the joints feel \"smooth\".</p><p><strong>Question:</strong> What physiological change in the synovial fluid explains this improvement with movement?</p>",
        opts: [
          "<strong>A)</strong> Movement heats the synovial fluid and evaporates it, leaving the joints drier",
          "<strong>B)</strong> During night rest, synovial fluid becomes more viscous (gel) due to the high concentration of hyaluronic acid. When moving, thixotropy (shear force) temporarily reduces its viscosity, improving lubrication",
          "<strong>C)</strong> Movement produces more synovial fluid from nothing"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Synovial fluid is a <strong>non-Newtonian</strong> fluid with unique properties:</p>
        <p><strong>Rheological properties:</strong></p>
        <ul>
          <li><strong>At rest:</strong> Hyaluronic acid (HA) forms a network of entangled polymers that makes the fluid very viscous (like a thick gel). This protects the joint when it is still.</li>
          <li><strong>During movement:</strong> Shear forces temporarily \"untangle\" the HA polymers, reducing viscosity (like when you shake ketchup and it becomes liquid).</li>
          <li><strong>This phenomenon is called thixotropy:</strong> Reversible change in viscosity depending on the applied force.</li>
        </ul>
        <p><strong>Consequences:</strong></p>
        <ul>
          <li>In the morning: high viscosity → stiff joints, cracking</li>
          <li>After 10-15 min of movement: reduced viscosity → optimal lubrication, smooth movement</li>
          <li>Lubricin (PRG4) is also redistributed with movement, forming a protective layer on the cartilage</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Synovial fluid is \"smart\": thick at rest (protects), fluid when moving (lubricates). That is why warming up is so important: it prepares the joint \"machinery\".</div>`
      },
      {
        header: "Case 3: The Sprain That Won't Heal",
        topic: "Proprioception",
        desc: "<p><strong>Situation:</strong> Marta sprained her ankle 3 months ago. The ligament is now healed (confirmed by ultrasound), but she still feels \"instability\" and frequently sprains it again, even on flat ground.</p><p><strong>Question:</strong> If the ligament is healed, why does she still feel unstable?</p>",
        opts: [
          "<strong>A)</strong> Because ligaments never fully heal",
          "<strong>B)</strong> Because during the sprain the proprioceptive mechanoreceptors of the ligament were damaged (Pacini corpuscles, Ruffini, Golgi tendon organs). The brain lost information about the ankle position → deficits in neuromuscular control → functional instability",
          "<strong>C)</strong> Because it is psychological, not physiological"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Ligaments are not just \"passive ropes\" that stabilise. They contain <strong>specialised mechanoreceptors</strong> that inform the brain:</p>
        <p><strong>Types of joint mechanoreceptors:</strong></p>
        <ul>
          <li><strong>Pacini corpuscles:</strong> Detect acceleration and rapid position changes (vibration)</li>
          <li><strong>Ruffini corpuscles:</strong> Detect sustained stretch and static position</li>
          <li><strong>Golgi-Mazzoni corpuscles:</strong> Detect deep pressure</li>
          <li><strong>Free nerve endings:</strong> Detect pain and chemical changes</li>
        </ul>
        <p><strong>The arthrokinetic reflex arc:</strong></p>
        <ul>
          <li>Mechanoreceptors send signals → spinal cord → muscles around the joint</li>
          <li>This reflex adjusts muscle tension in milliseconds to protect the joint</li>
          <li>After a sprain, up to 40% of these receptors can be permanently damaged</li>
        </ul>
        <p><strong>Consequence:</strong> Although the ligament heals structurally, the brain \"loses the map\" of the joint. Without precise information, the muscles cannot react in time → functional instability.</p>
        <div class="key-concept"><strong>💡 Key concept:</strong> After a sprain, proprioceptive rehabilitation (exercises on unstable surfaces, eyes closed) is ESSENTIAL. Without it, the risk of recurrence is 3-5 times higher.</div>`
      },
      {
        header: "Case 4: The Torn Meniscus",
        topic: "Joint parts",
        desc: "<p><strong>Situation:</strong> David, a 28-year-old footballer, suffers a tear of the medial meniscus of the knee. The MRI shows that the tear is in the central zone (\"white zone\"). The surgeon tells him it is likely not to heal on its own and that part will need to be removed.</p><p><strong>Question:</strong> Why can the central zone of the meniscus not heal on its own?</p>",
        opts: [
          "<strong>A)</strong> Because the meniscus has no cells",
          "<strong>B)</strong> Because the meniscus has 3 zones with different vascularisation: the peripheral zone (\"red\") has blood and can heal; the central zone (\"white\") is avascular and depends on diffusion of synovial fluid, so it cannot form a stable clot or initiate repair",
          "<strong>C)</strong> Because menisci are cartilage and have no healing capacity"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>The meniscus is a fibrocartilaginous structure with <strong>differential vascularisation</strong>:</p>
        <p><strong>The 3 zones of the meniscus:</strong></p>
        <ul>
          <li><strong>Red-red zone (peripheral, 10-30%):</strong> Supplied by the genicular artery. Has healing capacity. Tears here can be sutured with a good prognosis.</li>
          <li><strong>Red-white zone (middle, 20-30%):</strong> Limited vascularisation. Variable healing.</li>
          <li><strong>White-white zone (central, 40-50%):</strong> Avascular. Nourished by diffusion of synovial fluid. CanNOT heal because no blood arrives (and with it, cells, growth factors, oxygen).</li>
        </ul>
        <p><strong>Clinical implications:</strong></p>
        <ul>
          <li>Tears in white zone → partial meniscectomy (remove the damaged part)</li>
          <li>Tears in red zone → meniscal suture (attempt to repair)</li>
          <li>After meniscectomy: increased pressure on articular cartilage (the meniscus distributes 50% of the load) → higher risk of osteoarthritis in the long term</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> The meniscus is like a \"cushion with zones\": the outer part has blood and heals; the inner part does not. That is why the location of the tear determines the treatment.</div>`
      },
      {
        header: "Case 5: The Sauté in 3 Planes",
        topic: "Movement planes",
        desc: "<p><strong>Situation:</strong> A dance teacher analyses a <em>sauté</em> (vertical jump with feet together) of a student. She observes that:</p><ul><li>When going up and down: the knees flex and extend</li><li>The student tends to bring her knees inward (valgus)</li><li>On landing, the trunk rotates slightly to one side</li></ul><p><strong>Question:</strong> In which planes of space do these 3 movements occur?</p>",
        opts: [
          "<strong>A)</strong> All three occur in the same plane",
          "<strong>B)</strong> Flexion-extension: sagittal plane (divides the body into left/right); Knee valgus (adduction): frontal plane (divides into front/back); Trunk rotation: transverse plane (divides into up/down)",
          "<strong>C)</strong> Flexion: frontal plane; Valgus: transverse plane; Rotation: sagittal plane"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>The human body moves in <strong>3 cardinal planes</strong>, each with a perpendicular axis of rotation:</p>
        <p><strong>The 3 planes:</strong></p>
        <ul>
          <li><strong>Sagittal (lateral) plane:</strong> Divides the body into left and right halves. Axis: transverse (mediolateral).
            <ul><li>Movements: flexion-extension</li><li>Example in sauté: knee flexion when preparing the jump, extension when pushing off</li></ul>
          </li>
          <li><strong>Frontal (coronal) plane:</strong> Divides the body into anterior and posterior parts. Axis: anteroposterior.
            <ul><li>Movements: abduction-adduction, lateral tilt, eversion-inversion</li><li>Example in sauté: knee valgus (hip adduction + knee inward)</li></ul>
          </li>
          <li><strong>Transverse (horizontal) plane:</strong> Divides the body into upper and lower parts. Axis: vertical (longitudinal).
            <ul><li>Movements: internal-external rotation, pronation-supination</li><li>Example in sauté: trunk rotation on landing</li></ul>
          </li>
        </ul>
        <p><strong>Importance for technique:</strong></p>
        <ul>
          <li>A \"perfect\" sauté should occur only in the sagittal plane</li>
          <li>Valgus (frontal plane) and rotation (transverse plane) are compensations that increase the risk of injury (especially ACL)</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Every human movement is a combination of the 3 planes. Analysing in which plane a movement occurs helps identify compensations and prevent injuries.</div>`
      },
      {
        header: "Case 6: The Dancer's Osteoarthritis",
        topic: "Cartilage and load",
        desc: "<p><strong>Situation:</strong> Rosa, a 55-year-old ballet dancer, has osteoarthritis in both hips. Her twin sister, who never danced, has healthy hips. Rosa wonders: \"Has dancing all my life caused my osteoarthritis?\"</p><p><strong>Question:</strong> What is the most likely physiological explanation?</p>",
        opts: [
          "<strong>A)</strong> Dancing always causes osteoarthritis, cartilage \"wears out\" like a shoe sole",
          "<strong>B)</strong> Osteoarthritis is not just \"wear\". It is an active biological process where the balance between matrix synthesis and degradation breaks down. In elite dancers, repeated micro-injuries to the cartilage (from extreme loads and years of impact) can exceed the repair capacity of chondrocytes, triggering an inflammatory cascade that degrades cartilage",
          "<strong>C)</strong> It is only genetic, dancing has nothing to do with it"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Osteoarthritis is NOT simply \"mechanical wear\". It is a complex joint disease with active biological components:</p>
        <p><strong>Pathophysiology of osteoarthritis:</strong></p>
        <ul>
          <li><strong>Initial damage:</strong> Repeated microtrauma (years of ballet = thousands of hours of extreme load on the hips)</li>
          <li><strong>Chondrocyte response:</strong> Initially they increase matrix synthesis (repair attempt). But over time, they \"exhaust\" and change their phenotype.</li>
          <li><strong>Inflammatory cascade:</strong> Damaged chondrocytes release pro-inflammatory cytokines (IL-1β, TNF-α) and degrading enzymes (metalloproteinases - MMPs, aggrecanases - ADAMTS)</li>
          <li><strong>Matrix degradation:</strong> Type II collagen and proteoglycans (aggrecan) are destroyed</li>
          <li><strong>Bone changes:</strong> Subchondral bone scleroses (becomes harder), osteophytes appear (bone spurs)</li>
          <li><strong>Synovitis:</strong> The synovial membrane becomes inflamed, producing more fluid but of worse quality</li>
        </ul>
        <p><strong>Why Rosa yes and her sister no?</strong></p>
        <ul>
          <li>Mechanical factors: ballet = extreme loads on the hips (extensions, rotations)</li>
          <li>Genetic factors: both have the same genetics, but the environment (elite dance) \"activated\" the disease in Rosa</li>
          <li>The paradox: moderate exercise PROTECTS cartilage; extreme and repetitive exercise can damage it</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Osteoarthritis is a disease, not just \"wear\". Elite dance is a risk factor, but not a condemnation. The key is balance: adequate load + recovery + correct technique.</div>`
      },
      {
        header: "Case 7: The Hypermobile Dancer Who Cannot Stabilise",
        topic: "Types of joints",
        desc: "<p><strong>Situation:</strong> Elena, a 19-year-old dancer, is \"hypermobile\": she can put her hands on the floor without bending her knees, hyperextend her elbows more than 10°, and do the full splits easily. But she has chronic pain in her knees and shoulders, and frequent \"subluxations\" (the joint partially dislocates).</p><p><strong>Question:</strong> What type of joint does she have and what physiological problem explains her symptoms?</p>",
        opts: [
          "<strong>A)</strong> She has fibrous joints (synarthroses) that are too flexible",
          "<strong>B)</strong> She has synovial joints (diarthroses) with ligaments that are too lax due to altered collagen (possible hypermobile Ehlers-Danlos syndrome). The ligaments cannot stabilise the joint → muscles must overwork → fatigue and pain. Proprioception may also be altered",
          "<strong>C)</strong> She has cartilaginous joints (amphiarthroses) everywhere"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Synovial joints (diarthroses) are the most mobile in the body. Their stability depends on:</p>
        <p><strong>Passive stabilisers (non-contractile):</strong></p>
        <ul>
          <li><strong>Ligaments:</strong> Limit range of motion</li>
          <li><strong>Joint capsule:</strong> Surrounds the joint</li>
          <li><strong>Shape of bone surfaces:</strong> Mechanical fit</li>
          <li><strong>Negative intra-articular pressure:</strong> \"Suction\" that keeps surfaces in contact</li>
        </ul>
        <p><strong>Active stabilisers (contractile):</strong></p>
        <ul>
          <li><strong>Muscles:</strong> Provide dynamic stability</li>
          <li><strong>Tendons:</strong> Transmit muscle force</li>
        </ul>
        <p><strong>In hypermobility:</strong></p>
        <ul>
          <li>Ligaments have altered collagen (defect in type III collagen structure or cross-links)</li>
          <li>They are \"too elastic\" → do not limit movement → the joint is unstable</li>
          <li>Muscles must overwork to compensate → fatigue, pain, contractures</li>
          <li>Ligament mechanoreceptors may be altered → deficient proprioception</li>
          <li>Risk of subluxations and dislocations</li>
        </ul>
        <p><strong>Types of joints (reminder):</strong></p>
        <ul>
          <li><strong>Synarthroses (fibrous):</strong> No movement (e.g. cranial sutures)</li>
          <li><strong>Amphiarthroses (cartilaginous):</strong> Limited movement (e.g. pubic symphysis, intervertebral discs)</li>
          <li><strong>Diarthroses (synovial):</strong> Free movement (e.g. knee, shoulder, hip) ← Elena's</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Hypermobility is not an advantage in dance. It is a risk factor. These dancers need to STRENGTHEN muscles (active stabilisers) because the passive ones (ligaments) do not work well.</div>`
      },
      {
        header: "Case 8: Lubricin, the Hidden Molecule",
        topic: "Synovial fluid",
        desc: "<p><strong>Situation:</strong> A researcher studies genetically modified mice that do not produce <strong>lubricin</strong> (PRG4). The mice develop early osteoarthritis at 2 months of age, even though hyaluronic acid and synovial fluid are normal.</p><p><strong>Question:</strong> What specific function does lubricin have that explains this early osteoarthritis?</p>",
        opts: [
          "<strong>A)</strong> Lubricin is a type of hyaluronic acid",
          "<strong>B)</strong> Lubricin is a glycoprotein that forms a protective layer on cartilage, reducing the coefficient of friction to ultra-low values (0.001-0.01, similar to ice on ice). Without it, cartilage suffers direct friction → mechanical damage → osteoarthritis",
          "<strong>C)</strong> Lubricin nourishes cartilage"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Joint lubrication is a complex system with multiple mechanisms:</p>
        <p><strong>Lubrication mechanisms:</strong></p>
        <ul>
          <li><strong>Boundary lubrication:</strong> Molecules adsorbed to the cartilage surface form a protective layer. Lubricin (PRG4) is the main molecule of this system.</li>
          <li><strong>Fluid lubrication:</strong> Synovial fluid forms a film that separates the surfaces. Hyaluronic acid is key here.</li>
          <li><strong>Mixed lubrication:</strong> Combination of both mechanisms.</li>
        </ul>
        <p><strong>Lubricin (PRG4):</strong></p>
        <ul>
          <li>Glycoprotein produced by superficial chondrocytes and synovial cells</li>
          <li>Adheres to the cartilage surface via its ends</li>
          <li>The central part (richly glycosylated) repels other molecules → \"non-stick\" effect</li>
          <li>Reduces the coefficient of friction to 0.001-0.01 (similar to ice on ice, 10-100 times lower than rubber on asphalt)</li>
          <li>Also has anti-inflammatory function and protects against adhesion of inflammatory cells</li>
        </ul>
        <p><strong>Clinical implications:</strong></p>
        <ul>
          <li>Mutations in the PRG4 gene → CACP syndrome (lubricin deficiency arthropathy)</li>
          <li>In osteoarthritis, lubricin levels may be altered</li>
          <li>Current research: lubricin injections as a treatment for osteoarthritis</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Lubricin is the biological \"Teflon\" of joints. Without it, cartilage scratches like a non-stick pan without coating. Hyaluronic acid lubricates the fluid; lubricin, the surface.</div>`
      },
      {
        header: "Case 9: Proprioceptive Training",
        topic: "Proprioception",
        desc: "<p><strong>Situation:</strong> A physiotherapist works with a dancer who recovered from an anterior cruciate ligament (ACL) tear. In addition to strengthening muscles, he has him do exercises on a balance board, with eyes closed, and throwing a ball while standing on one leg.</p><p><strong>Question:</strong> Which physiological system is he specifically training with these exercises?</p>",
        opts: [
          "<strong>A)</strong> He is only training muscle strength",
          "<strong>B)</strong> He is training the proprioceptive system: it improves the capacity of mechanoreceptors (articular, muscular, cutaneous) to detect joint position, and the CNS's capacity to process this information and generate fast and precise motor responses. This is called \"neuromuscular re-education\"",
          "<strong>C)</strong> He is training flexibility"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Proprioception is the \"sixth sense\": the ability to perceive body position and movement without using sight.</p>
        <p><strong>Proprioceptive receptors:</strong></p>
        <ul>
          <li><strong>Articular:</strong> Mechanoreceptors in capsule and ligaments (Pacini, Ruffini, Golgi)</li>
          <li><strong>Muscular:</strong> Muscle spindles (detect length and rate of change)</li>
          <li><strong>Tendinous:</strong> Golgi tendon organs (detect tension)</li>
          <li><strong>Cutaneous:</strong> Skin receptors (pressure, touch)</li>
          <li><strong>Vestibular:</strong> Inner ear (balance and head orientation)</li>
        </ul>
        <p><strong>Proprioceptive pathways:</strong></p>
        <ul>
          <li><strong>Unconscious:</strong> Spinocerebellar pathway → cerebellum → automatic postural adjustment</li>
          <li><strong>Conscious:</strong> Dorsal columns pathway → somatosensory cortex → position perception</li>
        </ul>
        <p><strong>Principles of proprioceptive training:</strong></p>
        <ul>
          <li><strong>Progression:</strong> From stable to unstable, from eyes open to closed, from static to dynamic</li>
          <li><strong>Specificity:</strong> Exercises should mimic the demands of dance</li>
          <li><strong>Neuroplasticity:</strong> The brain can \"relearn\" to interpret proprioceptive signals after injury</li>
          <li><strong>Reflexes:</strong> Spinal reflexes and automatic postural adjustments are improved</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> After a joint injury, strengthening muscles is not enough. You must \"reconnect\" the nervous system with the joint. Without proprioceptive training, the risk of recurrence is very high.</div>`
      },
      {
        header: "Case 10: The Difference Between Joints",
        topic: "Types of joints",
        desc: "<p><strong>Situation:</strong> An anatomy student compares three joints:</p><ul><li><strong>A:</strong> Cranial sutures</li><li><strong>B:</strong> Pubic symphysis</li><li><strong>C:</strong> Knee</li></ul><p><strong>Question:</strong> What type of joint is each one and what physiological characteristics differentiate them?</p>",
        opts: [
          "<strong>A)</strong> All three are the same, only the name changes",
          "<strong>B)</strong> A = synarthrosis (fibrous, no movement, dense connective tissue); B = amphiarthrosis (cartilaginous, limited movement, fibrocartilage); C = diarthrosis (synovial, free movement, joint cavity with synovial fluid, hyaline cartilage)",
          "<strong>C)</strong> A = diarthrosis; B = synarthrosis; C = amphiarthrosis"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Joints are classified according to their <strong>structure</strong> (tissue type) and their <strong>function</strong> (degree of movement):</p>
        
        <p><strong>A) Cranial sutures - SYNARTHROSIS (fibrous):</strong></p>
        <ul>
          <li><strong>Tissue:</strong> Dense irregular connective tissue</li>
          <li><strong>Movement:</strong> None (0°)</li>
          <li><strong>Function:</strong> Protection of the brain</li>
          <li><strong>Evolution:</strong> They ossify with age (synostosis)</li>
          <li><strong>Examples:</strong> Coronal, sagittal, lambdoid sutures</li>
        </ul>
        
        <p><strong>B) Pubic symphysis - AMPHIARTHROSIS (cartilaginous):</strong></p>
        <ul>
          <li><strong>Tissue:</strong> Fibrocartilage (interpubic disc)</li>
          <li><strong>Movement:</strong> Limited (2-3° rotation, 1-2 mm translation)</li>
          <li><strong>Function:</strong> Impact absorption, pelvic stability</li>
          <li><strong>Physiological change:</strong> Becomes more lax during childbirth (relaxin)</li>
          <li><strong>Examples:</strong> Pubic symphysis, intervertebral discs, sternal manubrium</li>
        </ul>
        
        <p><strong>C) Knee - DIARTHROSIS (synovial):</strong></p>
        <ul>
          <li><strong>Tissue:</strong> Hyaline cartilage + capsule + ligaments + synovial fluid</li>
          <li><strong>Movement:</strong> Free (flexion-extension, minor rotations)</li>
          <li><strong>Special structures:</strong> Menisci, synovial bursae, Hoffa's fat pad</li>
          <li><strong>Function:</strong> Movement with minimal friction</li>
          <li><strong>Examples:</strong> Knee, shoulder, hip, ankle, elbow, wrist</li>
        </ul>
        
        <p><strong>Comparative summary:</strong></p>
        <table>
          <tr><th>Characteristic</th><th>Synarthrosis</th><th>Amphiarthrosis</th><th>Diarthrosis</th></tr>
          <tr><td><strong>Movement</strong></td><td>None</td><td>Limited</td><td>Free</td></tr>
          <tr><td><strong>Cavity</strong></td><td>No</td><td>No</td><td>Yes</td></tr>
          <tr><td><strong>Synovial fluid</strong></td><td>No</td><td>No</td><td>Yes</td></tr>
          <tr><td><strong>Example</strong></td><td>Sutures</td><td>Pubic symphysis</td><td>Knee</td></tr>
        </table>
        
        <div class="key-concept"><strong>💡 Key concept:</strong> Joint classification reflects the compromise between stability and mobility. Synarthroses prioritise protection; diarthroses, movement. Amphiarthroses are an intermediate point.</div>`
      }
    ]
  }
};

function renderIntro() {
  const t = I18N[currentLang];
  document.getElementById('t-header-title').textContent = t.headerTitle;
  document.getElementById('t-header-sub').textContent = t.headerSub;
  document.getElementById('t-intro-title').textContent = t.introTitle;
  document.getElementById('t-progress-label').textContent = t.progressLabel;
  document.getElementById('t-progress-cases').textContent = t.progressCases;
  
  document.getElementById('t-intro-content').innerHTML = `
    <p>${t.introP1}</p>
    <ul>${t.introUl.map(x => `<li>${x}</li>`).join('')}</ul>
    <p style="margin-top: 15px;">${t.introP2}</p>
  `;
}

function renderCases() {
  const t = I18N[currentLang];
  const container = document.getElementById('casesContainer');
  container.innerHTML = '';
  
  t.cases.forEach((c, idx) => {
    const caseNum = idx + 1;
    let html = `<div class="case" id="case${caseNum}">
      <div class="case-header">
        ${c.header}
        <span class="case-topic">${c.topic}</span>
      </div>
      <div class="case-description">${c.desc}</div>
      <div class="options">`;
    c.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(65 + oi);
      html += `<div class="option" data-value="${letter}">${opt}</div>`;
    });
    html += `</div>
      <button class="btn-check" onclick="checkAnswer(${caseNum}, '${c.correct}')">${t.btnCheck}</button>
      <div class="explanation-box" id="explanation${caseNum}">
        <h4 id="fb-title${caseNum}"></h4>
        <div class="explanation-content">${c.exp}</div>
      </div>
    </div>`;
    container.innerHTML += html;
  });
  
  // Restaurar estats
  completedCases = 0;
  Object.keys(selectedAnswers).forEach(caseNum => {
    const saved = selectedAnswers[caseNum];
    const caseEl = document.getElementById(`case${caseNum}`);
    if (!caseEl) return;
    const opts = caseEl.querySelectorAll('.option');
    const btn = caseEl.querySelector('.btn-check');
    const exp = document.getElementById(`explanation${caseNum}`);
    const fbTitle = document.getElementById(`fb-title${caseNum}`);
    
    opts.forEach(o => {
      if (o.getAttribute('data-value') === saved.selected) o.classList.add('selected');
      o.style.pointerEvents = 'none';
      o.style.opacity = '0.7';
      if (o.getAttribute('data-value') === saved.correct) { o.classList.add('correct'); o.style.opacity = '1'; }
      if (o.getAttribute('data-value') === saved.selected && saved.selected !== saved.correct) { o.classList.add('incorrect'); o.style.opacity = '1'; }
    });
    btn.disabled = true;
    if (saved.selected === saved.correct) {
      exp.classList.add('correct', 'show');
      fbTitle.textContent = t.fbCorrect + ' ' + saved.correct;
      completedCases++;
    } else {
      exp.classList.add('incorrect', 'show');
      fbTitle.textContent = t.fbIncorrect + ' ' + saved.correct;
    }
  });
  
  // Afegir listeners
  container.querySelectorAll('.option').forEach(option => {
    option.addEventListener('click', function() {
      if (this.style.pointerEvents === 'none') return;
      const parent = this.parentElement;
      parent.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
      this.classList.add('selected');
    });
  });
  
  updateProgress();
}

function checkAnswer(caseNum, correctAnswer) {
  const t = I18N[currentLang];
  const caseElement = document.getElementById(`case${caseNum}`);
  const options = caseElement.querySelectorAll('.option');
  const btn = caseElement.querySelector('.btn-check');
  const explanation = document.getElementById(`explanation${caseNum}`);
  const fbTitle = document.getElementById(`fb-title${caseNum}`);
  
  btn.disabled = true;
  
  let selectedValue = null;
  options.forEach(option => {
    if (option.classList.contains('selected')) {
      selectedValue = option.getAttribute('data-value');
    }
    option.style.pointerEvents = 'none';
    option.style.opacity = '0.7';
  });
  
  if (!selectedValue) {
    alert(t.alertSelect);
    btn.disabled = false;
    options.forEach(option => {
      option.style.pointerEvents = 'auto';
      option.style.opacity = '1';
    });
    return;
  }
  
  options.forEach(option => {
    if (option.getAttribute('data-value') === correctAnswer) {
      option.classList.add('correct');
      option.style.opacity = '1';
    } else if (option.getAttribute('data-value') === selectedValue && selectedValue !== correctAnswer) {
      option.classList.add('incorrect');
      option.style.opacity = '1';
    }
  });
  
  if (selectedValue === correctAnswer) {
    explanation.classList.add('correct', 'show');
    fbTitle.textContent = t.fbCorrect + ' ' + correctAnswer;
    completedCases++;
  } else {
    explanation.classList.add('incorrect', 'show');
    fbTitle.textContent = t.fbIncorrect + ' ' + correctAnswer;
  }
  
  selectedAnswers[caseNum] = { selected: selectedValue, correct: correctAnswer };
  updateProgress();
}

function updateProgress() {
  const t = I18N[currentLang];
  const progress = (completedCases / totalCases) * 100;
  document.getElementById('progressBar').style.width = progress + '%';
  document.getElementById('progress').textContent = completedCases;
  
  if (completedCases === totalCases) {
    setTimeout(() => { alert(t.alertComplete); }, 500);
  }
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  renderIntro();
  renderCases();
}

/* Inicialització */
setLang('ca');
</script>
</body>
</html>
