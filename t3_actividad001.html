<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador del Sarcómero</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #38bdf8; }
  .container { max-width: 900px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); position: relative; }
  canvas { background: #0b1220; border-radius: 8px; display: block; margin: 20px auto; max-width: 100%; }
  .controls { display: flex; justify-content: space-around; margin-top: 20px; flex-wrap: wrap; }
  .slider-box { flex: 1; min-width: 220px; margin: 10px; padding: 15px; background: #334155; border-radius: 8px; }
  input[type=range] { width: 100%; }
  .info { margin-top: 20px; padding: 15px; background: #0f172a; border-left: 4px solid #38bdf8; border-radius: 4px; min-height: 80px; }
  .estado { font-weight: bold; color: #fbbf24; }
  
  .language-selector {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 8px;
  }
  .language-selector button {
    background: rgba(56,189,248,0.15);
    border: 1px solid rgba(56,189,248,0.4);
    color: #38bdf8;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85em;
    font-weight: 600;
    transition: all 0.3s;
  }
  .language-selector button:hover {
    background: rgba(56,189,248,0.3);
  }
  .language-selector button.active {
    background: #38bdf8;
    color: #0f172a;
  }
  
  @media (max-width: 600px) {
    .language-selector { position: static; margin-bottom: 15px; justify-content: center; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="language-selector">
    <button class="active" onclick="setLanguage('es', this)">ES</button>
    <button onclick="setLanguage('ca', this)">CA</button>
    <button onclick="setLanguage('en', this)">EN</button>
  </div>
  <h1 data-i18n="title">🧬 Simulador del Sarcómero</h1>
  <canvas id="canvas" width="850" height="220"></canvas>
  <div class="controls">
    <div class="slider-box">
      <label data-i18n="ca_label">🟡 Nivel de Calcio (Ca²⁺): <span id="caVal">0</span>%</label>
      <input type="range" id="ca" min="0" max="100" value="0">
    </div>
    <div class="slider-box">
      <label data-i18n="atp_label">🔵 Nivel de ATP: <span id="atpVal">100</span>%</label>
      <input type="range" id="atp" min="0" max="100" value="100">
    </div>
  </div>
  <div class="info" id="info"></div>
</div>

<script>
let currentLang = 'es';

const translations = {
  es: {
    title: "🧬 Simulador del Sarcómero",
    ca_label: "🟡 Nivel de Calcio (Ca²⁺): ",
    atp_label: "🔵 Nivel de ATP: ",
    initial: "Ajusta los sliders para ver cómo responde el sarcómero.",
    state_active: "✅ CONTRACCIÓN ACTIVA: puentes cruzados funcionando.",
    state_rigor: "⚠️ RIGOR: Ca²⁺ alto pero sin ATP → miosina bloqueada (rigor mortis).",
    state_relax: "💤 RELAJACIÓN: sin Ca²⁺, la tropomiosina tapa los sitios activos de la actina.",
    state_block: "⛔ BLOQUEO TOTAL: sin Ca²⁺ y sin ATP.",
    mech_ca: "El Ca²⁺ se une a la troponina → desplaza la tropomiosina → expone sitios activos de la actina.",
    mech_no_ca: "Sin Ca²⁺, la tropomiosina oculta los sitios activos de la actina.",
    mech_atp_warning: "<br><b>⚠️ El ATP es necesario para DESACOPLAR la miosina de la actina.</b>",
    mech_label: "Mecanismo:",
    canvas_zline: "Línea Z",
    canvas_myosin: "Miosina (gruesos)",
    canvas_actin: "Actina (finos)",
    canvas_tropomyosin: "Tropomiosina bloqueando sitios activos"
  },
  ca: {
    title: "🧬 Simulador del Sarcòmer",
    ca_label: "🟡 Nivell de Calci (Ca²⁺): ",
    atp_label: "🔵 Nivell d'ATP: ",
    initial: "Ajusta els sliders per veure com respon el sarcòmer.",
    state_active: "✅ CONTRACCIÓ ACTIVA: ponts creuats funcionant.",
    state_rigor: "⚠️ RIGOR: Ca²⁺ alt però sense ATP → miosina bloquejada (rigor mortis).",
    state_relax: "💤 RELAXACIÓ: sense Ca²⁺, la tropomiosina tapa els llocs actius de l'actina.",
    state_block: "⛔ BLOQUEIG TOTAL: sense Ca²⁺ i sense ATP.",
    mech_ca: "El Ca²⁺ s'uneix a la troponina → desplaça la tropomiosina → exposa els llocs actius de l'actina.",
    mech_no_ca: "Sense Ca²⁺, la tropomiosina oculta els llocs actius de l'actina.",
    mech_atp_warning: "<br><b>⚠️ L'ATP és necessari per DESACOBLAR la miosina de l'actina.</b>",
    mech_label: "Mecanisme:",
    canvas_zline: "Línia Z",
    canvas_myosin: "Miosina (gruixuts)",
    canvas_actin: "Actina (prims)",
    canvas_tropomyosin: "Tropomiosina bloquejant llocs actius"
  },
  en: {
    title: "🧬 Sarcomere Simulator",
    ca_label: "🟡 Calcium level (Ca²⁺): ",
    atp_label: "🔵 ATP level: ",
    initial: "Adjust the sliders to see how the sarcomere responds.",
    state_active: "✅ ACTIVE CONTRACTION: cross-bridges working.",
    state_rigor: "⚠️ RIGOR: high Ca²⁺ but no ATP → myosin locked (rigor mortis).",
    state_relax: "💤 RELAXATION: without Ca²⁺, tropomyosin covers actin's active sites.",
    state_block: "⛔ TOTAL BLOCK: no Ca²⁺ and no ATP.",
    mech_ca: "Ca²⁺ binds to troponin → displaces tropomyosin → exposes actin's active sites.",
    mech_no_ca: "Without Ca²⁺, tropomyosin hides actin's active sites.",
    mech_atp_warning: "<br><b>⚠️ ATP is needed to DETACH myosin from actin.</b>",
    mech_label: "Mechanism:",
    canvas_zline: "Z-line",
    canvas_myosin: "Myosin (thick)",
    canvas_actin: "Actin (thin)",
    canvas_tropomyosin: "Tropomyosin blocking active sites"
  }
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const caSlider = document.getElementById('ca');
const atpSlider = document.getElementById('atp');
const info = document.getElementById('info');

function setLanguage(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.language-selector button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang] && translations[lang][key]) {
      // If the element contains a span (for the numeric value), preserve it
      const span = el.querySelector('span');
      if (span) {
        el.innerHTML = translations[lang][key] + span.outerHTML;
      } else {
        el.innerHTML = translations[lang][key];
      }
    }
  });
  
  document.documentElement.lang = lang;
  draw();
}

function draw() {
  const t = translations[currentLang];
  const ca = parseInt(caSlider.value);
  const atp = parseInt(atpSlider.value);
  document.getElementById('caVal').textContent = ca;
  document.getElementById('atpVal').textContent = atp;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Cálculo de acortamiento según Ca y ATP
  let acortamiento = 0;
  let estado = "";
  if (ca > 30 && atp > 20) {
    acortamiento = Math.min(80, (ca/100) * 100 * (atp/100));
    estado = t.state_active;
  } else if (ca > 30 && atp <= 20) {
    acortamiento = 60; // rigor
    estado = t.state_rigor;
  } else if (ca <= 30 && atp > 20) {
    acortamiento = 0;
    estado = t.state_relax;
  } else {
    acortamiento = 0;
    estado = t.state_block;
  }

  const offsetX = acortamiento;
  const y = 110;

  // Líneas Z
  ctx.strokeStyle = "#22d3ee"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(50, 40); ctx.lineTo(50, 180); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(800 - offsetX, 40); ctx.lineTo(800 - offsetX, 180); ctx.stroke();
  ctx.fillStyle = "#22d3ee"; ctx.font = "14px sans-serif";
  ctx.fillText(t.canvas_zline, 20, 30);
  ctx.fillText(t.canvas_zline, 770 - offsetX, 30);

  // Filamentos gruesos (miosina) - fijos
  ctx.fillStyle = "#64748b";
  for (let x = 200; x < 650; x += 40) {
    ctx.fillRect(x, 70, 15, 80);
  }
  ctx.fillStyle = "#94a3b8"; ctx.font = "12px sans-serif";
  ctx.fillText(t.canvas_myosin, 380, 60);

  // Filamentos finos (actina) - se desplazan
  ctx.fillStyle = "#f472b6";
  for (let x = 60; x < 250 - offsetX/2; x += 20) {
    ctx.fillRect(x, 85, 12, 50);
  }
  for (let x = 600 + offsetX/2; x < 790 - offsetX; x += 20) {
    ctx.fillRect(x, 85, 12, 50);
  }
  ctx.fillStyle = "#f9a8d4";
  ctx.fillText(t.canvas_actin, 100, 160);

  // Puentes cruzados (solo si hay Ca y ATP)
  if (ca > 30) {
    ctx.strokeStyle = atp > 20 ? "#fbbf24" : "#ef4444";
    ctx.lineWidth = 2;
    const heads = [[210,110],[290,110],[370,110],[450,110],[530,110],[610,110]];
    heads.forEach(([hx,hy]) => {
      const targetX = hx - 30 + offsetX/3;
      if (targetX > 200 - offsetX/2 && targetX < 600 + offsetX/2) {
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(targetX, hy + (atp>20?-10:0));
        ctx.stroke();
      }
    });
  }

  // Tropomiosina (visible solo si Ca bajo)
  if (ca <= 30) {
    ctx.fillStyle = "rgba(148,163,184,0.7)";
    ctx.fillRect(80, 105, 150 - offsetX/2, 4);
    ctx.fillRect(620 + offsetX/2, 105, 150 - offsetX/2, 4);
    ctx.fillStyle = "#cbd5e1"; ctx.font = "11px sans-serif";
    ctx.fillText(t.canvas_tropomyosin, 100, 125);
  }

  info.innerHTML = `<span class="estado">${estado}</span><br><br>
    <b>${t.mech_label}</b> ${ca>30 ? t.mech_ca : t.mech_no_ca}
    ${atp<=20 && ca>30 ? t.mech_atp_warning : ""}`;
}

caSlider.addEventListener('input', draw);
atpSlider.addEventListener('input', draw);

// Initialize with Spanish
setLanguage('es', document.querySelector('.language-selector button'));
</script>
</body>
</html>
