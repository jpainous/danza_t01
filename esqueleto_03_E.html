let currentLang = 'ca';

function showSlide(i, btn) {
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.slide')[i].classList.add('active');
  if (btn) btn.classList.add('active');
  window.scrollTo(0, 0);
}

function setLang(lang) {
  currentLang = lang;
  const t = I18N[lang];
  
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  
  document.getElementById('t-header-title').textContent = t.headerTitle;
  document.getElementById('t-header-sub').textContent = t.headerSub;
  document.getElementById('t-header-subtitle').textContent = t.headerSubtitle;
  t.tabs.forEach((tab, i) => { document.getElementById('tab' + i).textContent = tab; });
  
  document.getElementById('t-s1-h2').textContent = t.s1h2;
  document.getElementById('t-s2-h2').textContent = t.s2h2;
  document.getElementById('t-s3-h2').textContent = t.s3h2;
  document.getElementById('t-s4-h2').textContent = t.s4h2;
  document.getElementById('t-s4-h3').textContent = t.s4h3;
  document.getElementById('t-btn-check').textContent = t.btnCheck;
  document.getElementById('t-btn-reset').textContent = t.btnReset;
  
  renderSlide1(t.slide1);
  renderSlide2(t.slide2);
  renderSlide3(t.slide3);
  renderSlide4(t.slide4);
}

      </ul>
    </div>
  `;

function renderQuiz(quizData) {
  const cont = document.getElementById('quizContainer');
  cont.innerHTML = '';
  quizData.forEach((item, qi) => {
    let html = `<div class="question-box"><p>${qi+1}. ${item.q}</p><div class="options">`;
    item.opts.forEach((opt, oi) => {
      html += `<label><input type="radio" name="q${qi}" value="${oi}"> ${opt}</label>`;
    });
    html += `</div></div>`;
    cont.innerHTML += html;
  });
}

function checkQuiz() {
  const t = I18N[currentLang];
  let score = 0;
  t.slide4.quizData.forEach((item, qi) => {
    const sel = document.querySelector(`input[name="q${qi}"]:checked`);
    const labels = document.querySelectorAll(`input[name="q${qi}"]`);
    labels.forEach(l => l.parentElement.classList.remove('correct','incorrect'));
    if (sel) {
      const val = parseInt(sel.value);
      if (val === item.correct) {
        sel.parentElement.classList.add('correct');
        score++;
      } else {
        sel.parentElement.classList.add('incorrect');
        labels[item.correct].parentElement.classList.add('correct');
      }
    } else {
      labels[item.correct].parentElement.classList.add('correct');
    }
  });
  const fb = document.getElementById('fbQuiz');
  fb.classList.add('show');
  const total = t.slide4.quizData.length;
  if (score === total) {
    fb.className = 'feedback show success';
    fb.innerHTML = t.fbExcellent(score, total);
  } else if (score >= 6) {
    fb.className = 'feedback show';
    fb.style.background = '#fff3cd';
    fb.style.color = '#856404';
    fb.style.border = '2px solid #ffc107';
    fb.innerHTML = t.fbGood(score, total);
  } else {
    fb.className = 'feedback show error';
    fb.innerHTML = t.fbBad(score, total);
  }
}

function resetQuiz() {
  document.querySelectorAll('#quizContainer input').forEach(i => { i.checked = false; i.parentElement.classList.remove('correct','incorrect'); });
  document.getElementById('fbQuiz').classList.remove('show');
}
