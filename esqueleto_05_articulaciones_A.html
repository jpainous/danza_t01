          "<strong>C)</strong> Porque los ligamentos se vuelven más elásticos"
        ],
        correct: "B",
        exp: `<p><strong>Explicación fisiológica:</strong></p>
        <p>El entrenamiento propioceptivo no fortalece los músculos ni estira los ligamentos. Su efecto es <strong>neurológico</strong>: mejora la capacidad del sistema nervioso para controlar las articulaciones.</p>
        <p><strong>Mecanismos fisiológicos de adaptación:</strong></p>
        <ul>
          <li><strong>Mejora de la sensibilidad de los receptores:</strong>
            <ul><li>Los mecanorreceptores se vuelven más sensibles a estímulos pequeños.</li><li>Detectan cambios de posición más sutiles y los envían más rápido al cerebro.</li></ul>
          </li>
          <li><strong>Aceleración de la conducción nerviosa:</strong>
            <ul><li>Las vías nerviosas se \"mielinizan\" mejor (la mielina es como el \"aislante\" del cable que acelera la señal).</li><li>La información llega más rápido desde los receptores al cerebro y desde el cerebro a los músculos.</li></ul>
          </li>
          <li><strong>Optimización de los patrones musculares:</strong>
            <ul><li><strong>Co-contracción:</strong> Los músculos agonistas y antagonistas se activan simultáneamente para dar estabilidad (ej: cuádriceps e isquiotibiales en la rodilla).</li><li><strong>Respuestas anticipatorias:</strong> El cerebro aprende a activar los músculos estabilizadores ANTES de que ocurra el movimiento (feedforward). Ej: antes de levantar una pierna, se activan los músculos del tobillo y la cadera.</li><li><strong>Respuestas reflejas:</strong> Los reflejos de estiramiento se vuelven más rápidos y eficientes.</li></ul>
          </li>
          <li><strong>Integración sensorial:</strong>
            <ul><li>El cerebro aprende a integrar mejor la información propioceptiva, visual y vestibular.</li><li>Si falla una fuente (ej: cerrar los ojos), las otras compensan mejor.</li></ul>
          </li>
        </ul>
        <p><strong>¿Por qué es difícil al principio?</strong></p>
        <ul>
          <li>El cerebro está \"aprendiendo\" nuevas conexiones neuronales.</li>
          <li>Los patrones musculares no están automatizados.</li>
          <li>Con la práctica (4-8 semanas), se vuelve automático (como montar en bici).</li>
        </ul>
        <p><strong>Aplicación en danza:</strong></p>
        <ul>
          <li>Mejor equilibrio en relevés y arabesques.</li>
          <li>Menor riesgo de esguinces al aterrizar saltos.</li>
          <li>Mayor control en giros y piruetas.</li>
          <li>Mejor adaptación a superficies irregulares (escenarios al aire libre).</li>
        </ul>
        <div class="key-concept"><strong>💡 Concepto clave:</strong> El entrenamiento propioceptivo \"reprograma\" el sistema nervioso. No cambia la estructura (músculos, ligamentos), sino la función (control neuromuscular). Por eso es esencial para bailarines y deportistas.</div>`
      }
    ]

  en: {

    alertComplete: "🎉 Congratulations! You have completed all the practical cases on joint physiology. You now understand how these complex and dynamic structures work.",
    cases: [
      {
        header: "Case 1: The Dancer's Hip",
        topic: "Types of joints",
        desc: "<p><strong>Situation:</strong> Laura, a 28-year-old classical ballet dancer, develops early hip osteoarthritis. Her doctor explains that the hip is a <strong>ball-and-socket joint</strong> (spherical joint) and that this has advantages and disadvantages.</p><p><strong>Question:</strong> Which physiological characteristic of the ball-and-socket joint explains both its great mobility and its vulnerability to osteoarthritis in dancers?</p>",
        opts: [
          "<strong>A)</strong> That it has very little synovial fluid and dries out quickly",
          "<strong>B)</strong> That it allows movement in all 3 planes of space (multiaxial), but the rounded femoral head concentrates the load on a broad surface that, with repeated extreme movements, can damage the cartilage",
          "<strong>C)</strong> That it is a fibrous joint without cartilage"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p><strong>Ball-and-socket joints</strong> (like the hip and shoulder) are spherical joints where a rounded head fits into a cavity (cotyloid or glenoid). This structure has important physiological consequences:</p>
        <p><strong>Advantages:</strong></p>
        <ul>
          <li><strong>Multiaxiality:</strong> They allow movement in all 3 planes (flexion-extension, abduction-adduction, internal-external rotation). It is the joint type with the greatest range of motion.</li>
          <li><strong>Relative stability:</strong> The congruence between surfaces distributes the load well.</li>
        </ul>
        <p><strong>Disadvantages in dancers:</strong></p>
        <ul>
          <li><strong>Extreme movements:</strong> Dancers take the hip to extreme ranges (turnout, high extensions). This subjects the cartilage to loads in unusual areas.</li>
          <li><strong>Repetitive impact:</strong> In jumps and landings, the femoral head receives loads 3-5 times body weight, concentrated on the articular cartilage.</li>
          <li><strong>Early wear:</strong> The combination of extreme mobility + repetitive load accelerates cartilage wear → early osteoarthritis.</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Ball-and-socket joints are \"all-terrain\" (lots of mobility), but that versatility has a price: greater wear with extreme use. Dancers must balance mobility with strength to protect the cartilage.</div>`
      },
      {
        header: "Case 2: The Lifter's Unstable Shoulder",
        topic: "Types of joints",
        desc: "<p><strong>Situation:</strong> Miguel, a ballet lifter (the one who lifts the ballerina), suffers his third shoulder dislocation in 2 years. His physiotherapist tells him that the shoulder is the <strong>most unstable joint in the body</strong>.</p><p><strong>Question:</strong> Which structural characteristic of the shoulder (ball-and-socket) explains its high instability compared to the hip (also ball-and-socket)?</p>",
        opts: [
          "<strong>A)</strong> That the shoulder has fewer muscles around it",
          "<strong>B)</strong> That the glenoid cavity is very shallow compared to the humeral head (like a golf ball on a tee), which gives great mobility but little bony stability, depending more on muscles and ligaments",
          "<strong>C)</strong> That the shoulder has no joint capsule"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Although shoulder and hip are both ball-and-socket joints, their proportions are very different, which determines their functional behaviour:</p>
        <p><strong>Structural comparison:</strong></p>
        <ul>
          <li><strong>Hip:</strong> The cotyloid (cavity) covers ~75% of the femoral head. Great bony congruence → much passive stability.</li>
          <li><strong>Shoulder:</strong> The glenoid cavity covers only ~25-30% of the humeral head. Little bony congruence → little passive stability.</li>
        </ul>
        <p><strong>Physiological consequences:</strong></p>
        <ul>
          <li><strong>Muscular dependence:</strong> The shoulder depends on the <strong>rotator cuff</strong> (4 muscles) to keep the humeral head centred in the glenoid during movement. If these muscles fatigue or weaken, the shoulder dislocates.</li>
          <li><strong>Lax capsule:</strong> The shoulder capsule is very lax (allows great mobility) but offers little stability.</li>
          <li><strong>Glenoid labrum:</strong> It is a ring of fibrocartilage that deepens the cavity, but it can be injured and worsen instability.</li>
          <li><strong>For the lifter:</strong> Lifting weight with the arm in abduction and external rotation (\"throwing\" position) is the most vulnerable position for dislocation.</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> The shoulder sacrifices stability for mobility. That is why it is the most dislocated joint in the body. Lifters must especially strengthen the rotator cuff and scapula.</div>`
      },
      {
        header: "Case 3: The Runner's Swollen Knee",
        topic: "Parts of a joint",
        desc: "<p><strong>Situation:</strong> Juan, a marathon runner, notices that his knee swells after running 20 km. The MRI shows excess fluid in the joint. The doctor diagnoses <strong>joint effusion</strong>.</p><p><strong>Question:</strong> Which joint structure produces synovial fluid and why does it accumulate in excess in this case?</p>",
        opts: [
          "<strong>A)</strong> The articular cartilage produces fluid when damaged",
          "<strong>B)</strong> The synovial membrane (inner layer of the capsule) produces synovial fluid. In response to irritation from overload, it produces more fluid (inflammation) as a protective mechanism, but the excess causes swelling and limited movement",
          "<strong>C)</strong> The ligaments produce fluid to lubricate"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p><strong>Synovial fluid</strong> is essential for joint health and is produced by a specific structure:</p>
        <p><strong>The synovial membrane:</strong></p>
        <ul>
          <li>It is the inner layer of the joint capsule.</li>
          <li>It is made up of <strong>synoviocytes</strong> (specialised cells) of two types:
            <ul><li><strong>Type A:</strong> Macrophages (clean waste).</li><li><strong>Type B:</strong> Fibroblasts (produce hyaluronic acid and lubricin).</li></ul>
          </li>
          <li>It produces 1-4 ml of synovial fluid under normal conditions (in a knee).</li>
        </ul>
        <p><strong>Functions of synovial fluid:</strong></p>
        <ul>
          <li><strong>Lubrication:</strong> Reduces friction between cartilages (friction coefficient 5 times lower than ice on ice).</li>
          <li><strong>Nutrition:</strong> Cartilage has no blood vessels, it is nourished by diffusion of synovial fluid.</li>
          <li><strong>Cushioning:</strong> Absorbs impacts.</li>
        </ul>
        <p><strong>Why the effusion?</strong></p>
        <ul>
          <li>In response to irritation (overload, microtrauma), the synovial membrane becomes inflamed (synovitis).</li>
          <li>The synoviocytes produce more fluid as a protective response.</li>
          <li>The excess fluid causes swelling, pain and limited movement (due to capsule distension).</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Synovial fluid is like the \"engine oil\" of the joint. Without it, the cartilage becomes malnourished and wears out. But excess (effusion) indicates irritation and the cause must be treated.</div>`
      },
      {
        header: "Case 4: The Cruciate Ligament Injury",
        topic: "Parts of a joint",
        desc: "<p><strong>Situation:</strong> Marta, a footballer, suffers an anterior cruciate ligament (ACL) tear in her knee while changing direction. The surgeon explains that ligaments are structures that are <strong>mostly avascular</strong>.</p><p><strong>Question:</strong> Why do ligaments (like the ACL) have such poor healing capacity compared to other tissues?</p>",
        opts: [
          "<strong>A)</strong> Because they are made of a special material that cannot be repaired",
          "<strong>B)</strong> Because most of the ligament has very little vascularisation (especially the ACL, bathed in synovial fluid that inhibits coagulation), which limits the arrival of nutrients, oxygen and repair cells. In addition, synovial fluid contains enzymes that degrade the initial clot needed for healing",
          "<strong>C)</strong> Because ligaments have no living cells"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Intra-articular ligaments (inside the joint) such as the ACL have characteristics that drastically limit their healing capacity:</p>
        <p><strong>Factors that limit healing:</strong></p>
        <ul>
          <li><strong>Poor vascularisation:</strong>
            <ul><li>Only the bone insertion zone is well vascularised.</li><li>The central part of the ACL has very limited blood vessels.</li><li>Without blood, repair cells and nutrients do not arrive.</li></ul>
          </li>
          <li><strong>Bath in synovial fluid:</strong>
            <ul><li>The ACL is inside the joint, bathed in synovial fluid.</li><li>Synovial fluid contains <strong>fibrinolytic enzymes</strong> that degrade fibrinogen and prevent the formation of a stable clot.</li><li>Without a stable clot, the initial \"scaffold\" for repair does not form.</li></ul>
          </li>
          <li><strong>Constant mechanical load:</strong>
            <ul><li>The knee moves constantly (even when walking).</li><li>Continuous movement prevents the immobilisation necessary for healing.</li><li>Shear forces break the fragile initial unions.</li></ul>
          </li>
          <li><strong>Ligament retraction:</strong>
            <ul><li>When the ACL tears, the ends retract (shrink).</li><li>The ends remain separated and cannot \"touch\" to unite.</li></ul>
          </li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Only 5-10% of complete ACL tears heal spontaneously. That is why, in young and active athletes, surgical reconstruction with a tendon (autograft or allograft) is recommended.</div>`
      },
      {
        header: "Case 5: The Astronaut's Cartilage",
        topic: "Cartilage and movement",
        desc: "<p><strong>Situation:</strong> An astronaut spends 6 months on the International Space Station. Upon returning to Earth, MRI scans show that the cartilage in his knees has <strong>thinned by 8%</strong> and lost mechanical properties.</p><p><strong>Question:</strong> Which physiological mechanism explains the deterioration of cartilage in the absence of load?</p>",
        opts: [
          "<strong>A)</strong> Because it is very cold in space and the cartilage freezes",
          "<strong>B)</strong> Because cartilage needs cyclic mechanical load for synovial fluid to circulate and nourish the chondrocytes. Without load, the cartilage becomes \"malnourished\", the chondrocytes reduce matrix synthesis (collagen and proteoglycans), and the cartilage degrades",
          "<strong>C)</strong> Because the gravity in space is different and damages the cartilage"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Articular cartilage is a unique tissue that depends completely on <strong>movement and load</strong> for its nutrition and maintenance:</p>
        <p><strong>Cartilage nutrition mechanism:</strong></p>
        <ul>
          <li><strong>No blood vessels:</strong> Mature cartilage is avascular. It does not receive blood directly.</li>
          <li><strong>Nutrition by diffusion:</strong> Nutrients (oxygen, glucose, amino acids) and waste (CO₂, lactate) must diffuse through the synovial fluid.</li>
          <li><strong>The \"pump\" of movement:</strong>
            <ul><li><strong>Compression (load):</strong> When loading the joint (e.g. walking), the cartilage compresses and \"squeezes\" synovial fluid out, eliminating waste.</li><li><strong>Decompression (unloading):</strong> When the load is removed, the cartilage expands and \"absorbs\" fresh synovial fluid with nutrients.</li><li>This compression-decompression cycle is essential for cartilage nutrition.</li></ul>
          </li>
        </ul>
        <p><strong>What happens in space?</strong></p>
        <ul>
          <li><strong>Microgravity:</strong> There is no significant load on the joints (astronauts \"float\").</li>
          <li><strong>No nutrition \"pump\":</strong> Synovial fluid does not circulate properly.</li>
          <li><strong>Consequences:</strong>
            <ul><li>Chondrocytes receive fewer nutrients.</li><li>They reduce synthesis of type II collagen and proteoglycans (matrix components).</li><li>Cartilage loses thickness and mechanical properties.</li><li>Activity of degrading enzymes (metalloproteinases) increases.</li></ul>
          </li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Cartilage needs load to live. Prolonged immobilisation (bed rest, cast, space) is as harmful to cartilage as excess load. Balance is key!</div>`
      },
      {
        header: "Case 6: The Sedentary Writer's Osteoarthritis",
        topic: "Cartilage and movement",
        desc: "<p><strong>Situation:</strong> Carlos, a 45-year-old programmer who spends 10 hours a day sitting, develops knee osteoarthritis. His doctor tells him that a sedentary lifestyle is a risk factor as important as being overweight.</p><p><strong>Question:</strong> Why does a sedentary lifestyle (absence of movement) damage articular cartilage?</p>",
        opts: [
          "<strong>A)</strong> Because sitting weakens the bones",
          "<strong>B)</strong> Because without cyclic movement, the cartilage does not receive adequate nutrition (the compression-decompression \"pump\" does not work), the chondrocytes become metabolically inactive, and the collagen and proteoglycan matrix progressively degrades",
          "<strong>C)</strong> Because sitting stretches the cartilage too much"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>A sedentary lifestyle is one of the greatest enemies of articular cartilage, although it may seem paradoxical (one would think that \"not using\" protects):</p>
        <p><strong>Physiological consequences of a sedentary lifestyle:</strong></p>
        <ul>
          <li><strong>Lack of nutrition:</strong>
            <ul><li>Without compression-decompression cycles, synovial fluid does not circulate.</li><li>Chondrocytes receive less glucose, oxygen and amino acids.</li><li>Metabolic waste accumulates (lactate, free radicals).</li></ul>
          </li>
          <li><strong>Chondrocyte inactivity:</strong>
            <ul><li>Chondrocytes are mechanosensitive: they need mechanical stimuli to stay active.</li><li>Without load, they reduce synthesis of type II collagen and aggrecan (main proteoglycan).</li><li>Expression of catabolic genes (MMPs, ADAMTS) that degrade the matrix increases.</li></ul>
          </li>
          <li><strong>Loss of mechanical properties:</strong>
            <ul><li>Cartilage loses its ability to absorb impacts.</li><li>It becomes thinner and less elastic.</li><li>Friction between articular surfaces increases.</li></ul>
          </li>
          <li><strong>Muscle weakness:</strong>
            <ul><li>The muscles that stabilise the joint weaken.</li><li>The joint receives more direct load (less muscle cushioning).</li><li>Risk of injury and wear increases.</li></ul>
          </li>
        </ul>
        <p><strong>Scientific studies:</strong></p>
        <ul>
          <li>Sedentary people have 2-3 times higher risk of knee osteoarthritis than active people.</li>
          <li>Moderate and regular exercise (walking, swimming, cycling) protects cartilage.</li>
          <li>Intense exercise without preparation can damage it. Dose matters!</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> \"Use it or lose it\" applies perfectly to cartilage. Moderate and regular movement is the best \"medicine\" to protect joints.</div>`
      },
      {
        header: "Case 7: The Ankle Sprain in Inversion",
        topic: "Planes of movement",
        desc: "<p><strong>Situation:</strong> Ana, a basketball player, lands badly after a rebound and suffers an ankle sprain. Her foot went \"inward\" (sole of the foot facing the other foot). The doctor diagnoses a sprain of the lateral ligaments.</p><p><strong>Question:</strong> In which plane of space did the injurious movement occur and what type of joint movement is it?</p>",
        opts: [
          "<strong>A)</strong> Sagittal plane - flexion-extension movement",
          "<strong>B)</strong> Frontal plane - inversion movement (combination of supination, adduction and plantar flexion). The lateral ligaments are not designed to resist this movement in excess",
          "<strong>C)</strong> Transverse plane - rotation movement"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>The <strong>planes of movement</strong> are anatomical references that describe the direction in which a joint moves:</p>
        <p><strong>The 3 planes:</strong></p>
        <ul>
          <li><strong>Sagittal plane:</strong> Divides the body into left and right. Movements: flexion-extension (e.g. walking, bending the elbow).</li>
          <li><strong>Frontal plane:</strong> Divides the body into front and back. Movements: abduction-adduction, inversion-eversion (e.g. opening/closing legs, moving the foot inward/outward).</li>
          <li><strong>Transverse plane:</strong> Divides the body into top and bottom. Movements: rotations (e.g. turning the head, shoulder rotation).</li>
        </ul>
        <p><strong>The ankle sprain in inversion:</strong></p>
        <ul>
          <li><strong>Frontal plane:</strong> The inversion movement (sole of the foot inward) occurs mainly in this plane.</li>
          <li><strong>Complex movement:</strong> Inversion is actually a combination of:
            <ul><li>Supination (eversion of the foot).</li><li>Adduction (foot toward the midline).</li><li>Plantar flexion (toes downward).</li></ul>
          </li>
          <li><strong>Ligaments affected:</strong> The lateral ligaments (anterior, middle and posterior tibio-talar) are designed to resist eversion (foot outward), not excessive inversion.</li>
          <li><strong>Injury mechanism:</strong> When landing badly, the foot goes into inversion beyond the safe range → the lateral ligaments stretch too much → they tear (sprain).</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> 85% of ankle sprains are in inversion (lateral ligaments). Only 15% are in eversion (medial/deltoid ligament). Knowing the planes helps understand the mechanism and prevent injuries.</div>`
      },
      {
        header: "Case 8: The Skier's Knee Rotation",
        topic: "Planes of movement",
        desc: "<p><strong>Situation:</strong> Pedro, a skier, falls with his ski on and his knee becomes \"twisted\". The MRI shows a tear of the ACL and the medial meniscus. The doctor explains that the knee is a joint that allows movement mainly in one plane, but that rotation is dangerous.</p><p><strong>Question:</strong> Why is the knee (a joint mainly of the sagittal plane) so vulnerable to rotational injuries (transverse plane)?</p>",
        opts: [
          "<strong>A)</strong> Because the knee has no ligaments",
          "<strong>B)</strong> Because the knee is a modified joint (ginglymus with a rotational component) where the menisci and cruciate ligaments stabilise rotation. When the tibia rotates on the femur with the knee flexed and loaded, the ligaments (especially the ACL) and menisci receive shear forces for which they are not well designed",
          "<strong>C)</strong> Because skis are too long"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>The knee is a complex joint with unique characteristics that make it vulnerable to rotational injuries:</p>
        <p><strong>Biomechanical characteristics of the knee:</strong></p>
        <ul>
          <li><strong>Modified joint:</strong>
            <ul><li>It is mainly a <strong>ginglymus</strong> (hinge) that allows flexion-extension in the sagittal plane.</li><li>But it has a minor rotational component (especially in flexion).</li><li>When the knee is fully extended, there is a rotational \"lock\" (screw-home mechanism) that provides stability.</li></ul>
          </li>
          <li><strong>Stabilising structures:</strong>
            <ul><li><strong>Cruciate ligaments (ACL and PCL):</strong> Control anterior/posterior displacement of the tibia and limit rotation.</li><li><strong>Menisci:</strong> Improve congruence between femur and tibia, absorb impacts and help stabilise.</li><li><strong>Collateral ligaments:</strong> Stabilise in the frontal plane (valgus/varus).</li></ul>
          </li>
          <li><strong>Injury mechanism in skiing:</strong>
            <ul><li>The ski fixes the foot (cannot rotate freely).</li><li>When falling, the body rotates but the foot remains fixed → the tibia rotates on the femur.</li><li>If the knee is flexed and loaded (body weight), this rotation generates enormous shear forces.</li><li>The ACL (which limits internal rotation of the tibia) tears.</li><li>The medial meniscus (more fixed than the lateral) is also injured.</li></ul>
          </li>
        </ul>
        <p><strong>Why is rotation so harmful?</strong></p>
        <ul>
          <li>Ligaments are designed to resist traction (stretching), not shear (perpendicular forces).</li>
          <li>Rotation combined with load multiplies forces.</li>
          <li>The menisci, being fixed at their ends, can be \"trapped\" and tear.</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> The knee is vulnerable to rotation because it is designed mainly for flexion-extension. That is why rotational injuries (skiing, football, basketball) are so serious and affect multiple structures (ACL + meniscus).</div>`
      },
      {
        header: "Case 9: The Ankle That Always Twists",
        topic: "Proprioception",
        desc: "<p><strong>Situation:</strong> Lucía suffered a severe ankle sprain 6 months ago. Although the ligament healed, she notices that her ankle \"twists\" easily on irregular terrain. Her physiotherapist tells her she has a <strong>proprioceptive deficit</strong>.</p><p><strong>Question:</strong> What is proprioception and why is it lost after a sprain?</p>",
        opts: [
          "<strong>A)</strong> Proprioception is muscle strength, and it is lost because the muscle atrophies",
          "<strong>B)</strong> Proprioception is the ability to feel the position and movement of joints. It is lost because the sprain damages the mechanoreceptors (muscle spindles, Golgi tendon organs, joint receptors) that send information to the brain about the ankle position. Without this information, the brain cannot quickly correct dangerous positions",
          "<strong>C)</strong> Proprioception is flexibility, and it is lost because the scarred ligament is more rigid"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p><strong>Proprioception</strong> is the body's \"sixth sense\": the ability to perceive the position, movement and force of joints and muscles without needing to look.</p>
        <p><strong>Proprioceptive system:</strong></p>
        <ul>
          <li><strong>Mechanoreceptors:</strong> They are specialised sensors that detect mechanical deformations:
            <ul><li><strong>Muscle spindles:</strong> Detect muscle length and rate of change.</li><li><strong>Golgi tendon organs:</strong> Detect tension in the tendon.</li><li><strong>Joint receptors (Ruffini, Pacini, etc.):</strong> They are in the capsule and ligaments. They detect joint position, pressure and acceleration.</li></ul>
          </li>
          <li><strong>Nerve pathways:</strong>
            <ul><li>Mechanoreceptors send signals via afferent nerves to the spinal cord and brain.</li><li>The brain integrates this information with visual and vestibular information.</li><li>It sends motor responses to adjust position and protect the joint.</li></ul>
          </li>
        </ul>
        <p><strong>Why is it lost after a sprain?</strong></p>
        <ul>
          <li><strong>Damage to receptors:</strong> When ligaments tear or stretch, the mechanoreceptors they contain are also damaged.</li>
          <li><strong>Signal alteration:</strong> Fewer receptors = less information to the brain = the brain \"sees\" the ankle position worse.</li>
          <li><strong>Slow muscle response:</strong> Without precise information, the muscles that stabilise the ankle (peroneals) do not activate in time to correct a dangerous position.</li>
          <li><strong>Vicious circle:</strong> More sprains → more receptor damage → more proprioceptive deficit → more sprains.</li>
        </ul>
        <p><strong>Scientific studies:</strong></p>
        <ul>
          <li>After a sprain, proprioception can take 3-6 months to recover completely.</li>
          <li>Proprioceptive training (balance on unstable surfaces) reduces the risk of recurrence by 50%.</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Proprioception is as important as strength and flexibility for preventing injuries. After a sprain, balance training is essential to \"re-educate\" the nervous system.</div>`
      },
      {
        header: "Case 10: The Dancer's Proprioceptive Training",
        topic: "Proprioception",
        desc: "<p><strong>Situation:</strong> A dance teacher includes in his classes exercises of balance on one leg, with eyes closed, and on unstable surfaces (bosu, cushions). The students complain that it is \"very difficult\" at first, but notice that their stability improves.</p><p><strong>Question:</strong> What physiological mechanism explains the improvement in stability with proprioceptive training?</p>",
        opts: [
          "<strong>A)</strong> Because the muscles get stronger and endure more",
          "<strong>B)</strong> Because proprioceptive training improves the sensitivity of mechanoreceptors, speeds up nerve conduction, and optimises muscle activation patterns (co-contraction, anticipatory responses). The brain learns to process information better and respond faster to protect the joints",
          "<strong>C)</strong> Because the ligaments become more elastic"
        ],
        correct: "B",
        exp: `<p><strong>Physiological explanation:</strong></p>
        <p>Proprioceptive training does not strengthen muscles or stretch ligaments. Its effect is <strong>neurological</strong>: it improves the nervous system's ability to control joints.</p>
        <p><strong>Physiological adaptation mechanisms:</strong></p>
        <ul>
          <li><strong>Improved receptor sensitivity:</strong>
            <ul><li>Mechanoreceptors become more sensitive to small stimuli.</li><li>They detect subtler position changes and send them to the brain faster.</li></ul>
          </li>
          <li><strong>Accelerated nerve conduction:</strong>
            <ul><li>Nerve pathways \"myelinate\" better (myelin is like the \"insulation\" of the cable that speeds up the signal).</li><li>Information arrives faster from receptors to the brain and from the brain to the muscles.</li></ul>
          </li>
          <li><strong>Optimisation of muscle patterns:</strong>
            <ul><li><strong>Co-contraction:</strong> Agonist and antagonist muscles activate simultaneously to provide stability (e.g. quadriceps and hamstrings in the knee).</li><li><strong>Anticipatory responses:</strong> The brain learns to activate stabilising muscles BEFORE movement occurs (feedforward). E.g. before lifting a leg, the ankle and hip muscles activate.</li><li><strong>Reflex responses:</strong> Stretch reflexes become faster and more efficient.</li></ul>
          </li>
          <li><strong>Sensory integration:</strong>
            <ul><li>The brain learns to better integrate proprioceptive, visual and vestibular information.</li><li>If one source fails (e.g. closing the eyes), the others compensate better.</li></ul>
          </li>
        </ul>
        <p><strong>Why is it difficult at first?</strong></p>
        <ul>
          <li>The brain is \"learning\" new neural connections.</li>
          <li>Muscle patterns are not automated.</li>
          <li>With practice (4-8 weeks), it becomes automatic (like riding a bike).</li>
        </ul>
        <p><strong>Application in dance:</strong></p>
        <ul>
          <li>Better balance in relevés and arabesques.</li>
          <li>Lower risk of sprains when landing jumps.</li>
          <li>Greater control in turns and pirouettes.</li>
          <li>Better adaptation to irregular surfaces (outdoor stages).</li>
        </ul>
        <div class="key-concept"><strong>💡 Key concept:</strong> Proprioceptive training \"reprogrammes\" the nervous system. It does not change structure (muscles, ligaments), but function (neuromuscular control). That is why it is essential for dancers and athletes.</div>`
      }
    ]
  }
};

/* ============================================================
   ESTAT I RENDER
   ============================================================ */
let currentLang = 'ca';
let completedCases = 0;
const totalCases = 10;
let selectedAnswers = {};

function renderIntro() {
  const t = I18N[currentLang];
  document.getElementById('t-header-title').textContent = t.headerTitle;
  document.getElementById('t-header-sub').textContent = t.headerSub;
  document.getElementById('t-intro-title').textContent = t.introTitle;
  document.getElementById('t-progress-label').textContent = t.progressLabel;
  document.getElementById('t-progress-cases').textContent = t.progressCases;
  
  document.getElementById('t-intro-content').innerHTML = `
    <p>${t.introP1}</p>
    <p>${t.introP2}</p>
    <ul>${t.introUl.map(x => `<li>${x}</li>`).join('')}</ul>
    <p style="margin-top: 15px;">${t.introP3}</p>
  `;
}

function renderCases() {
  const t = I18N[currentLang];
  const container = document.getElementById('casesContainer');
  container.innerHTML = '';
  
  t.cases.forEach((c, idx) => {
    const caseNum = idx + 1;
    let html = `<div class="case" id="case${caseNum}">
      <div class="case-header">${c.header} <span class="case-topic">${c.topic}</span></div>
      <div class="case-description">${c.desc}</div>
      <div class="options">`;
    c.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(65 + oi);
      html += `<div class="option" data-value="${letter}">${opt}</div>`;
    });
    html += `</div>
      <button class="btn-check" onclick="checkAnswer(${caseNum}, '${c.correct}')">${t.btnCheck}</button>
      <div class="explanation-box" id="explanation${caseNum}">
        <h4 id="fb-title${caseNum}"></h4>
        <div class="explanation-content">${c.exp}</div>
      </div>
    </div>`;
    container.innerHTML += html;
  });
  
  // Restaurar estats
  completedCases = 0;
  Object.keys(selectedAnswers).forEach(caseNum => {
    const saved = selectedAnswers[caseNum];
    const caseEl = document.getElementById(`case${caseNum}`);
    if (!caseEl) return;
    const opts = caseEl.querySelectorAll('.option');
    const btn = caseEl.querySelector('.btn-check');
    const exp = document.getElementById(`explanation${caseNum}`);
    const fbTitle = document.getElementById(`fb-title${caseNum}`);
    
    opts.forEach(o => {
      if (o.getAttribute('data-value') === saved.selected) o.classList.add('selected');
      o.style.pointerEvents = 'none';
      o.style.opacity = '0.7';
      if (o.getAttribute('data-value') === saved.correct) { o.classList.add('correct'); o.style.opacity = '1'; }
      if (o.getAttribute('data-value') === saved.selected && saved.selected !== saved.correct) { o.classList.add('incorrect'); o.style.opacity = '1'; }
    });
    btn.disabled = true;
    if (saved.selected === saved.correct) {
      exp.classList.add('correct', 'show');
      fbTitle.textContent = t.fbCorrect + ' ' + saved.correct;
      completedCases++;
    } else {
      exp.classList.add('incorrect', 'show');
      fbTitle.textContent = t.fbIncorrect + ' ' + saved.correct;
    }
  });
  
  // Afegir listeners
  container.querySelectorAll('.option').forEach(option => {
    option.addEventListener('click', function() {
      if (this.style.pointerEvents === 'none') return;
      const parent = this.parentElement;
      parent.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
      this.classList.add('selected');
    });
  });
  
  updateProgress();
}

function checkAnswer(caseNum, correctAnswer) {
  const t = I18N[currentLang];
  const caseElement = document.getElementById(`case${caseNum}`);
  const options = caseElement.querySelectorAll('.option');
  const btn = caseElement.querySelector('.btn-check');
  const explanation = document.getElementById(`explanation${caseNum}`);
  const fbTitle = document.getElementById(`fb-title${caseNum}`);
  
  btn.disabled = true;
  
  let selectedValue = null;
  options.forEach(option => {
    if (option.classList.contains('selected')) {
      selectedValue = option.getAttribute('data-value');
    }
    option.style.pointerEvents = 'none';
    option.style.opacity = '0.7';
  });
  
  if (!selectedValue) {
    alert(t.alertSelect);
    btn.disabled = false;
    options.forEach(option => {
      option.style.pointerEvents = 'auto';
      option.style.opacity = '1';
    });
    return;
  }
  
  options.forEach(option => {
    if (option.getAttribute('data-value') === correctAnswer) {
      option.classList.add('correct');
      option.style.opacity = '1';
    } else if (option.getAttribute('data-value') === selectedValue && selectedValue !== correctAnswer) {
      option.classList.add('incorrect');
      option.style.opacity = '1';
    }
  });
  
  if (selectedValue === correctAnswer) {
    explanation.classList.add('correct', 'show');
    fbTitle.textContent = t.fbCorrect + ' ' + correctAnswer;
    completedCases++;
  } else {
    explanation.classList.add('incorrect', 'show');
    fbTitle.textContent = t.fbIncorrect + ' ' + correctAnswer;
  }
  
  selectedAnswers[caseNum] = { selected: selectedValue, correct: correctAnswer };
  updateProgress();
}

function updateProgress() {
  const t = I18N[currentLang];
  const progress = (completedCases / totalCases) * 100;
  document.getElementById('progressBar').style.width = progress + '%';
  document.getElementById('progress').textContent = completedCases;
  
  if (completedCases === totalCases) {
    setTimeout(() => { alert(t.alertComplete); }, 500);
  }
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  renderIntro();
  renderCases();
}

/* Inicialització */
setLang('ca');
</script>
