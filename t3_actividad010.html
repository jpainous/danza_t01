function changeLanguage(lang) {
currentLang = lang;
document.documentElement.lang = lang;
// Actualitzar botons d'idioma
document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
document.querySelector(`.lang-btn[onclick="changeLanguage('${lang}')"]`).classList.add('active');
// Traduir elements estàtics
document.querySelectorAll('[data-translate]').forEach(el => {
const key = el.getAttribute('data-translate');
if (translations[lang][key]) {
el.innerHTML = translations[lang][key];
}
});
// Re-renderitzar l'escena actual
mostrar();
}

function mostrar() {
const t = translations[currentLang];
const prog = document.getElementById('progreso');
prog.innerHTML = '';
for (let i = 0; i < casos.length; i++) {
const div = document.createElement('div');
div.className = 'paso' + (i < paso ? ' hecho' : i === paso ? ' activo' : '');
prog.appendChild(div);
}
if (paso >= casos.length) {
mostrarFinal();
return;
}
const c = casos[paso];
document.getElementById('escena').innerHTML = `
<div class="escena">
<h3>${t[c.titleKey]}</h3>
<div class="personaje">
<div class="avatar">${c.avatar}</div>
<div class="dialogo">${t[c.textKey]}</div>
</div>
<div class="opciones">
${c.opciones.map((o,i) => `<div class="opcion" onclick="elegir(${o.sig})">${t[o.textoKey]}</div>`).join('')}
</div>
</div>
`;
}

function elegir(sig) {
paso++;
mostrar();
}

function mostrarFinal() {
const t = translations[currentLang];
document.getElementById('escena').innerHTML = `
<div class="resultado">
<h2 style="color:#f59e0b;">${t.finalTitle}</h2>
<div class="diagnostico">${t.finalDiagnosis}</div>

}
