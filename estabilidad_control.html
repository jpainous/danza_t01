/* ============================================================
   RENDER
   ============================================================ */
let currentLang = 'ca';
const exerciseState = {};

function buildNav() {
  const t = I18N[currentLang];
  const nav = document.getElementById('navTabs');
  nav.innerHTML = '';
  t.tabs.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.textContent = tab;
    btn.onclick = () => showSlide(i, btn);
    if (i === 0) btn.classList.add('active');
    nav.appendChild(btn);
  });
}

function buildSlides() {
  const t = I18N[currentLang];
  const container = document.getElementById('slidesContainer');
  container.innerHTML = '';
  
  // Slide 0: Introducció
  let introHtml = `<div class="slide active">
    <h2>${t.intro.h2}</h2>
    <div class="intro-box">
      <h3>${t.intro.introH3}</h3>
      <p>${t.intro.introP}</p>
    </div>
    <div class="how-it-works">
      <h4>${t.intro.whyH4}</h4>
      <ul>${t.intro.whyUl.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>
    <div class="muscle-info">
      <h4>${t.intro.exH4}</h4>
      <p>${t.intro.exP}</p>
    </div>
    <div class="tip-box">
      <h4>${t.intro.danceH4}</h4>
      <p>${t.intro.danceP}</p>
      <ul>${t.intro.danceUl.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>
  </div>`;
  container.innerHTML += introHtml;
  
  // Slides 1-10: Exercicis
  t.exercises.forEach(ex => {
    let exHtml = `<div class="slide">
      <h2>${ex.title}</h2>
      <div class="exercise-card">
        <h3><span class="emoji"></span> ${ex.cardH3}</h3>
        <div class="how-it-works">
          <h4>${ex.howH4}</h4>
          <ul>${ex.howUl.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="muscle-info">
          <h4>${ex.muscleH4}</h4>
          <ul>${ex.muscleUl.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="tip-box">
          <h4>${ex.tipH4}</h4>
          <p>${ex.tipP}</p>
        </div>
      </div>
      <div class="scenario-box">
        <h4>${ex.scenarioH4}</h4>
        <p>${ex.scenarioP}</p>
        <div class="options-grid" id="options${ex.num}">`;
    ex.opts.forEach((opt, oi) => {
      exHtml += `<div class="option-card" onclick="selectOption(${ex.num}, ${oi}, ${oi === ex.correct})">
        <strong>${t.btnCheck === 'Verificar resposta' ? 'Opció' : t.btnCheck === 'Verificar respuesta' ? 'Opción' : 'Option'} ${String.fromCharCode(65+oi)}</strong>
        ${opt}
      </div>`;
    });
    exHtml += `</div>
        <div class="explanation-field">
          <label for="explanation${ex.num}">💭 ${currentLang === 'ca' ? 'Explica amb les teves paraules per què vas triar aquesta opció:' : currentLang === 'es' ? 'Explica con tus palabras por qué elegiste esta opción:' : 'Explain in your own words why you chose this option:'}</label>
          <textarea id="explanation${ex.num}" placeholder="${currentLang === 'ca' ? 'Pensa en què li passa als teus músculs quan fan un esforç perllongat...' : currentLang === 'es' ? 'Piensa en qué le pasa a tus músculos cuando hacen un esfuerzo prolongado...' : 'Think about what happens to your muscles during prolonged effort...'}"></textarea>
        </div>
        <button class="btn" onclick="checkAnswer(${ex.num})">${t.btnCheck}</button>
        <button class="btn btn-secondary" onclick="resetExercise(${ex.num})">${t.btnReset}</button>
        <div class="feedback" id="feedback${ex.num}"></div>
      </div>
    </div>`;
    container.innerHTML += exHtml;
  });
  
  // Slide 11: Resum
  let summaryHtml = `<div class="slide">
    <h2>${t.summary.h2}</h2>
    <div class="intro-box">
      <h3>${t.summary.introH3}</h3>
      <p>${t.summary.introP}</p>
    </div>
    <div class="how-it-works">
      <h4>${t.summary.keyH4}</h4>
      <ul>${t.summary.keyUl.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>
    <div class="muscle-info">
      <h4>${t.summary.tipsH4}</h4>
      <ul>${t.summary.tipsUl.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>
    <div class="tip-box">
      <h4>${t.summary.danceH4}</h4>
      <p>${t.summary.danceP}</p>
      <ul>${t.summary.danceUl.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>
  </div>`;
  container.innerHTML += summaryHtml;
}

function setLang(lang) {
  currentLang = lang;
  const t = I18N[lang];
  
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  
  document.getElementById('t-header-title').textContent = t.headerTitle;
  document.getElementById('t-header-sub').textContent = t.headerSub;
  document.getElementById('t-header-subtitle').textContent = t.headerSubtitle;
  
  buildNav();
  buildSlides();
  
  // Restaurar estats
  Object.keys(exerciseState).forEach(num => {
    const state = exerciseState[num];
    const options = document.querySelectorAll(`#options${num} .option-card`);
    if (options.length === 0) return;
    const feedback = document.getElementById(`feedback${num}`);
    options[state.selected].classList.add('selected');
    if (state.checked) {
      options[state.selected].classList.add(state.isCorrect ? 'correct' : 'incorrect');
      feedback.classList.add('show');
      if (state.isCorrect) {
        feedback.className = 'feedback show success';
        feedback.innerHTML = t.exercises[num-1].correctFb;
      } else {
        feedback.className = 'feedback show error';
        feedback.innerHTML = t.exercises[num-1].incorrectFb;
      }
    }
  });
}

function showSlide(i, btn) {
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
  const slides = document.querySelectorAll('.slide');
  if (slides[i]) slides[i].classList.add('active');
  if (btn) btn.classList.add('active');
  window.scrollTo(0, 0);
}

function selectOption(exerciseNum, optionIndex, isCorrect) {
  const options = document.querySelectorAll(`#options${exerciseNum} .option-card`);
  options.forEach(opt => opt.classList.remove('selected', 'correct', 'incorrect'));
  options[optionIndex].classList.add('selected');
  exerciseState[exerciseNum] = { selected: optionIndex, isCorrect, checked: false };
}

function checkAnswer(exerciseNum) {
  const t = I18N[currentLang];
  if (!exerciseState[exerciseNum] || exerciseState[exerciseNum].selected === undefined) {
    alert(t.alertSelect);
    return;
  }
  
  const state = exerciseState[exerciseNum];
  const feedback = document.getElementById(`feedback${exerciseNum}`);
  const options = document.querySelectorAll(`#options${exerciseNum} .option-card`);
  
  options.forEach((opt, idx) => {
    opt.classList.remove('correct', 'incorrect');
    if (idx === state.selected) {
      opt.classList.add(state.isCorrect ? 'correct' : 'incorrect');
    }
  });
  
  feedback.classList.remove('show');
  setTimeout(() => {
    feedback.classList.add('show');
    if (state.isCorrect) {
      feedback.className = 'feedback show success';
      feedback.innerHTML = t.exercises[exerciseNum-1].correctFb;
    } else {
      feedback.className = 'feedback show error';
      feedback.innerHTML = t.exercises[exerciseNum-1].incorrectFb;
    }
  }, 100);
  
  state.checked = true;
}

function resetExercise(exerciseNum) {
  const options = document.querySelectorAll(`#options${exerciseNum} .option-card`);
  options.forEach(opt => opt.classList.remove('selected', 'correct', 'incorrect'));
  const textarea = document.getElementById(`explanation${exerciseNum}`);
  if (textarea) textarea.value = '';
  const feedback = document.getElementById(`feedback${exerciseNum}`);
  feedback.classList.remove('show');
  delete exerciseState[exerciseNum];
}

/* Inicialització */
setLang('ca');
